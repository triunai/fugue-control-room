0022fugue\u0022;\n\n    public string Audience { get; set; } = \u0022fugue-api\u0022;\n\n    public string SigningKey { get; set; } = string.Empty;\n\n    public int AccessTokenMinutes { get; set; } = 15;\n\n    public int ClockSkewSeconds { get; set; } = 30;\n\n    public int RefreshTokenDays { get; set; } = 7;\n\n    /// \u003Csummary\u003EThe decoded key. Only valid after \u003Csee cref=\u0022AuthOptionsValidator\u0022/\u003E has passed.\u003C/summary\u003E\n    public byte[] KeyBytes() =\u003E Convert.FromBase64String(SigningKey);\n}\n\n/// \u003Csummary\u003EStartup validation (\u003Cc\u003EValidateOnStart\u003C/c\u003E): a missing, undecodable, short, repetitive or placeholder key stops the host.\u003C/summary\u003E\npublic sealed class AuthOptionsValidator : IValidateOptions\u003CAuthOptions\u003E\n{\n    /// \u003Csummary\u003EDocumented placeholder spellings that must never reach a running host.\u003C/summary\u003E\n    private static readonly string[] Placeholders = [\u0022REPLACE\u0022, \u0022CHANGE\u0022, \u0022SECRET\u0022, \u0022PASSWORD\u0022, \u0022EXAMPLE\u0022, \u0022PLACEHOLDER\u0022, \u0022TODO\u0022];\n\n    public ValidateOptionsResult Validate(string? name, AuthOptions options)\n    {\n        var failures = new List\u003Cstring\u003E();\n        if (string.IsNullOrWhiteSpace(options.Issuer) || string.IsNullOrWhiteSpace(options.Audience))\n        {\n            failures.Add(\u0022Auth:Issuer and Auth:Audience are required.\u0022);\n        }\n\n        if (options.AccessTokenMinutes is \u003C 1 or \u003E 60)\n        {\n            failures.Add(\u0022Auth:AccessTokenMinutes must be between 1 and 60.\u0022);\n        }\n\n        if (options.RefreshTokenDays is \u003C 1 or \u003E 90)\n        {\n            failures.Add(\u0022Auth:RefreshTokenDays must be between 1 and 90.\u0022);\n        }\n\n        failures.AddRange(ValidateKey(options.SigningKey));\n        return failures.Count == 0 ? ValidateOptionsResult.Success : ValidateOptionsResult.Fail(failures);\n    }\n\n    public static IEnumerable\u003Cstring\u003E ValidateKey(string? key)\n    {\n        if (string.IsNullOrWhiteSpace(key))\n        {\n            yield return \u0022Auth:SigningKey is not set. Generate one with \u0060openssl rand -base64 32\u0060 and supply it via user-secrets or Auth__SigningKey.\u0022;\n            yield break;\n        }\n\n        byte[]? bytes = TryDecode(key);\n        if (bytes is null)\n        {\n            yield return \u0022Auth:SigningKey must be base64 (openssl rand -base64 32).\u0022;\n            yield break;\n        }\n\n        if (bytes.Length \u003C AuthOptions.MinKeyBytes)\n        {\n            yield return $\u0022Auth:SigningKey decodes to {bytes.Length} bytes; at least {AuthOptions.MinKeyBytes} random bytes are required.\u0022;\n        }\n\n        string text = System.Text.Encoding.ASCII.GetString(bytes).ToUpperInvariant();\n        if (Placeholders.Any(text.Contains) || Placeholders.Any(key.ToUpperInvariant().Contains))\n        {\n            yield return \u0022Auth:SigningKey looks like a placeholder, not random bytes.\u0022;\n        }\n\n        if (bytes.Distinct().Count() \u003C 8)\n        {\n            yield return \u0022Auth:SigningKey has too little entropy (fewer than 8 distinct byte values).\u0022;\n        }\n    }\n\n    private static byte[]? TryDecode(string key)\n    {\n        try\n        {\n            return Convert.FromBase64String(key);\n        }\n        catch (FormatException)\n        {\n            return null;\n        }\n    }\n}\n","mutants":[{"id":"42","mutatorName":"String mutation","replacement":"\u0022\u0022","location":{"start":{"line":14,"column":42},"end":{"line":14,"column":49}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"43","mutatorName":"String mutation","replacement":"\u0022\u0022","location":{"start":{"line":16,"column":44},"end":{"line":16,"column":55}},"status":"Ignored","statu utate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"119","mutatorName":"Statement mutation","replacement":";","location":{"start":{"line":86,"column":13},"end":{"line":86,"column":104}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"120","mutatorName":"String mutation","replacement":"\u0022\u0022","location":{"start":{"line":86,"column":26},"end":{"line":86,"column":103}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"121","mutatorName":"Block removal mutation","replacement":"{}","location":{"start":{"line":91,"column":5},"end":{"line":100,"column":6}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"122","mutatorName":"Block removal mutation","replacement":"{}","location":{"start":{"line":93,"column":9},"end":{"line":95,"column":10}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"123","mutatorName":"Block removal mutation","replacement":"{}","location":{"start":{"line":97,"column":9},"end":{"line":99,"column":10}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]}]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Auth/AuthRateLimiting.cs":{"language":"cs","source":"using System.Threading.RateLimiting;\nusing Fugue.Api.Contracts;\nusing Fugue.Api.Http;\nusing Fugue.Domain.Identity;\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.AspNetCore.Mvc.Filters;\nusing Microsoft.AspNetCore.RateLimiting;\nusing Microsoft.Extensions.Options;\n\nnamespace Fugue.Api.Auth;\n\n/// \u003Csummary\u003E\u003Cc\u003ERateLimiting:Auth:*\u003C/c\u003E. Small windows on purpose: this is the brute-force control (there is no lockout).\u003C/summary\u003E\npublic sealed class AuthRateLimitOptions\n{\n    public const string Section = \u0022RateLimiting:Auth\u0022;\n\n    public int PerIpPermits { get; set; } = 20;\n\n    /// \u003Csummary\u003EThe strict bucket: attempts per (client IP, canonical email) per \u003Csee cref=\u0022WindowSeconds\u0022/\u003E (D-035).\u003C/summary\u003E\n    public int PerEmailPermits { get; set; } = 5;\n\n    public int WindowSeconds { get; set; } = 60;\n\n    /// \u003Csummary\u003EConcurrent in-flight attempts per (client IP, canonical email).\u003C/summary\u003E\n    public int PerEmailConcurrency { get; set; } = 2;\n\n    /// \u003Csummary\u003EThe loose ceiling: attempts that did not succeed per canonical email, from any IP, per \u003Csee cref=\u0022EmailCeilingWindowSeconds\u0022/\u003E (D-035).\u003C/summary\u003E\n    public int EmailCeilingPermits { get; set; } = 50;\n\n    public int EmailCeilingWindowSeconds { get; set; } = 900;\n}\n\npublic static class AuthRateLimiting\n{\n    public const string IpPolicy = \u0022auth-ip\u0022;\n\n    /// \u003Csummary\u003ERegisters the built-in rate limiter with the per-client-IP policy and a problem\u002Bjson 429.\u003C/summary\u003E\n    public static IServiceCollection AddAuthRateLimiting(this IServiceCollection services, IConfiguration configuration)\n    {\n        services.Configure\u003CAuthRateLimitOptions\u003E(configuration.GetSection(AuthRateLimitOptions.Section));\n        services.AddSingleton\u003CEmailRateLimiter\u003E();\n        services.AddScoped\u003CEmailRateLimitFilter\u003E();\n        services.AddRateLimiter(limiter =\u003E\n        {\n            limiter.RejectionStatusCode = StatusCodes.Status429TooManyRequests;\n            limiter.OnRejected = async (context, _) =\u003E await WriteRejected(context.HttpContext, context.Lease);\n            limiter.AddPolicy(IpPolicy, http =\u003E\n            {\n                AuthRateLimitOptions o = http.RequestServices.GetRequiredService\u003CIOptions\u003CAuthRateLimitOptions\u003E\u003E().Value;\n                return RateLimitPartition.GetFixedWindo nPolicyProvider\u0022/\u003E\n/// builds the policy on demand, so endpoints never name roles.\n/// \u003C/summary\u003E\n[AttributeUsage(AttributeTargets.Class | AttributeTargets.Method, AllowMultiple = true)]\npublic sealed class HasPermissionAttribute : AuthorizeAttribute\n{\n    public const string PolicyPrefix = \u0022perm:\u0022;\n\n    public HasPermissionAttribute(string permission)\n    {\n        Permission = permission;\n        Policy = PolicyPrefix \u002B permission;\n    }\n\n    public string Permission { get; }\n}\n\npublic sealed class PermissionRequirement(string permission) : IAuthorizationRequirement\n{\n    public string Permission { get; } = permission;\n}\n\n/// \u003Csummary\u003EBuilds \u003Cc\u003Eperm:*\u003C/c\u003E policies; every other name goes to the default provider (so [Authorize] keeps working).\u003C/summary\u003E\npublic sealed class PermissionPolicyProvider(Microsoft.Extensions.Options.IOptions\u003CAuthorizationOptions\u003E options)\n    : DefaultAuthorizationPolicyProvider(options)\n{\n    public override async Task\u003CAuthorizationPolicy?\u003E GetPolicyAsync(string policyName)\n    {\n        if (policyName.StartsWith(HasPermissionAttribute.PolicyPrefix, StringComparison.Ordinal))\n        {\n            return new AuthorizationPolicyBuilder()\n                .RequireAuthenticatedUser()\n                .AddRequirements(new PermissionRequirement(policyName[HasPermissionAttribute.PolicyPrefix.Length..]))\n                .Build();\n        }\n\n        return await base.GetPolicyAsync(policyName);\n    }\n}\n\npublic sealed class PermissionHandler : AuthorizationHandler\u003CPermissionRequirement\u003E\n{\n    protected override Task HandleRequirementAsync(AuthorizationHandlerContext context, PermissionRequirement requirement)\n    {\n        if (context.User.HasClaim(FugueClaimTypes.Permission, requirement.Permission))\n        {\n            context.Succeed(requirement);\n        }\n\n        return Task.CompletedTask;\n ecurityKey(o.KeyBytes()), SecurityAlgorithms.HmacSha256),\n        };\n\n        var handler = new JwtSecurityTokenHandler { SetDefaultTimesOnTokenCreation = false };\n        return new IssuedToken(handler.WriteToken(handler.CreateToken(descriptor)), expires);\n    }\n}\n","mutants":[{"id":"224","mutatorName":"Block removal mutation","replacement":"{}","location":{"start":{"line":16,"column":5},"end":{"line":37,"column":6}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"225","mutatorName":"Object initializer mutation","replacement":"new SecurityTokenDescriptor\n{}","location":{"start":{"line":20,"column":26},"end":{"line":33,"column":10}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"226","mutatorName":"String mutation","replacement":"\u0022\u0022","location":{"start":{"line":30,"column":80},"end":{"line":30,"column":83}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"227","mutatorName":"Object initializer mutation","replacement":"new JwtSecurityTokenHandler {}","location":{"start":{"line":35,"column":23},"end":{"line":35,"column":93}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"228","mutatorName":"Boolean mutation","replacement":"true","location":{"start":{"line":35,"column":86},"end":{"line":35,"column":91}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]}]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Auth/JwtBearerSetup.cs":{"language":"cs","source":"using System.Security.Claims;\nusing Fugue.Api.Http;\nusing Fugue.Application.Abstractions;\nusing Fugue.Domain.Ids;\nusing Microsoft.AspNetCore.Authentication.JwtBearer;\nusing Microsoft.Extensions.Options;\nusing Microsoft.IdentityModel.Tokens;\n\nnamespace Fugue.Api.Auth;\n\n/// \u003Csummary\u003E\n/// Configures JwtBearer from \u003Csee cref=\u0022AuthOptions\u0022/\u003E: HS256 only, issuer, audience, signature and lifetime all validated\n/// (lifetime against \u003Csee cref=\u0022TimeProvider\u0022/\u003E so tests and issuance share one clock), claims not remapped. The per-request\n/// permission lookup runs in \u003Cc\u003EOnTokenValidated\u003C/c\u003E (once per request, because the handler caches its result) and can fail\n/// the ticket for an inactive or deleted user. 401 and 403 are written as problem\u002Bjson; both leave an \u003Cc\u003Eaccess_audit\u003C/c\u003E row\n/// (the 401 one is bounded per client IP, \u003Csee cref=\u0022UnauthenticatedAuditLimiter\u0022/\u003E).\n/// \u003C/summary\u003E\npublic sealed class JwtBearerSetup(IOptions\u003CAuthOptions\u003E auth, TimeProvider time) : IConfigureNamedOptions\u003CJwtBearerOptions\u003E\n{\n    public void Configure(JwtBearerOptions options) =\u003E Configure(JwtBearerDefaults.AuthenticationScheme, options);\n\n    public void Configure(string? name, JwtBearerOptions options)\n    {\n        if (name != JwtBearerDefaults.AuthenticationScheme)\n        {\n            return;\n        }\n\n        AuthOptions o = auth.Value;\n        options.MapInboundClaims = false;\n        options.RequireHttpsMetadata = false; // symmetric key, no metadata endpoint\n        options.TokenValidationParameters = new TokenValidationParameters\n        {\n            ValidateIssuer = true,\n            ValidIssuer = o.Issuer,\n            ValidateAudience = true,\n            ValidAudience = o.Audience,\n            ValidateIssuerSigningKey = true,\n            IssuerSigningKey = new SymmetricSecurityKey(o.KeyBytes()),\n            ValidAlgorithms = [SecurityAlgorithms.HmacSha256],\n            RequireSignedTokens = true,\n            RequireExpirationTime = true,\n            ValidateLifetime = true,\n            ClockSkew = TimeSpan.FromSeconds(o.ClockSkewSeconds),\n            LifetimeValidator = (notBefore, expires, _, p) =\u003E\n            {\n                DateTime now = time.GetUtcNow().UtcDateTime;\n                return expires is not null \u0026\u0026 expires.Value \u002B p.ClockSkew \u003E now\n                    \u0026\u0026 (notBefore is null || notBefore.Value - p.ClockSkew \u003C= now);\n            },\n            NameClaimType = FugueClaimTypes.Subject,\n        };\n        options.Events = new JwtBearerEvents\n        {\n            OnTokenValidated = OnTokenValidated,\n            OnChallenge = OnChallenge,\n            OnForbidden = OnForbidden,\n        };\n    }\n\n    private static async Task OnTokenValidated(TokenValidatedContext context)\n    {\n        string? sub = context.Principal?.FindFirstValue(FugueClaimTypes.Subject);\n        if (!Guid.TryParse(sub, out Guid id) || context.Principal?.Identity is not ClaimsIdentity identity)\n        {\n            context.Fail(\u0022Token has no usable subject.\u0022);\n            return;\n        }\n\n        IUserAccessReader reader = context.HttpContext.RequestServices.GetRequiredService\u003CIUserAccessReader\u003E();\n        UserAccess? access = await reader.GetAsync(UserId.From(id), context.HttpContext.RequestAborted);\n        if (access is null)\n        {\n            context.Fail(\u0022User is unknown, inactive or deleted.\u0022);\n            return;\n        }\n\n        // Defence in depth: the issuer never puts permissions in a token, but a token that somehow carries \u0060perm\u0060 claims must not keep them.\n        foreach (Claim stale in identity.FindAll(FugueClaimTypes.Permission).ToList())\n        {\n            identity.RemoveClaim(stale);\n        }\n\n        foreach (string permission in access.Permissions)\n        {\n            identity.AddClaim(new Claim(FugueClaimTypes.Permission, permission));\n        }\n\n        if (access.TenantId is { } tenant)\n        {\n            identity.AddClaim(new Claim(FugueClaimTypes.TenantId, tenant.Value.ToString()));\n        }\n    }\n\n    private static async Task OnChallenge(JwtBearerChallengeContext context)\n    {\n        context.HandleResponse();\n        await RecordUnauthenticatedAsync(context);\n        context.Response.Headers.WWWAuthenticate = \u0022Bearer\u0022;\n        await AuthProblems.WriteAsync(\n            context.HttpContext, StatusCodes.Status401Unauthorized, \u0022auth.unauthenticated\u0022, \u0022Authentication is required or the token is not valid.\u0022);\n    }\n\n    /// \u003Csummary\u003E\n    /// Writes the \u003Cc\u003Eunauthenticated\u003C/c\u003E/\u003Cc\u003Edenied\u003C/c\u003E access_audit row of a 401, bounded per client IP. The client is told nothing about the\n    /// reason (the response is identical for all three); the token itself is never read into the row.\n    /// \u003C/summary\u003E\n    private static async Task RecordUnauthenticatedAsync(JwtBearerChallengeContext context)\n    {\n        HttpContext http = context.HttpContext;\n        try\n        {\n            ClientInfo client = AuthProblems.ClientOf(http);\n            if (!http.RequestServices.GetRequiredService\u003CUnauthenticatedAuditLimiter\u003E().TryAcquire(client.Ip))\n            {\n                AuditMetrics.RecordWriteFailure(AuditMetrics.AccessAuditTable, AuditMetrics.SuppressedReason);\n                return;\n            }\n\n            string reason = ReasonFor(context.AuthenticateFailure, http.Request.Headers.ContainsKey(\u0022Authorization\u0022), http.RequestServices.GetRequiredService\u003CTimeProvider\u003E());\n            await http.RequestServices.GetRequiredService\u003CIAccessAuditWriter\u003E().WriteAsync(\n                new AccessAuditEntry(\u0022unauthenticated\u0022, \u0022denied\u0022, reason, null, null, client), http.RequestAborted);\n        }\n        catch (OperationCanceledException) when (!http.RequestAborted.IsCancellationRequested)\n        {\n            // The audit write was canceled on its own (a time g RefreshToken);\n\npublic sealed record LogoutRequest(string RefreshToken);\n\npublic sealed record SetOverrideRequest(bool IsAllowed, string? Reason, DateTimeOffset? ExpiresAt);\n","mutants":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Contracts/ClaimRequests.cs":{"language":"cs","source":"using Fugue.Application.Features.Claims;\nusing Fugue.Domain.Claims;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace Fugue.Api.Contracts;\n\n/// \u003Csummary\u003EBody of a claim submission. The claimant is the caller; the currency follows from \u003Cc\u003EMarket\u003C/c\u003E.\u003C/summary\u003E\npublic sealed record SubmitClaimRequest(\n    Market Market, LineOfBusiness Line, string PolicyNumber, DateOnly IncidentDate, string IncidentDescription, string? IncidentLocation = null);\n\n/// \u003Csummary\u003EBody of a reserve update: bigint minor units in the claim\u0027s currency (for example 125000 is 1,250.00 in a two-decimal currency).\u003C/summary\u003E\npublic sealed record SetClaimReserveRequest(long AmountMinor);\n\n/// \u003Csummary\u003EBody of an information request: the question the claimant must answer.\u003C/summary\u003E\npublic sealed record RequestClaimInfoRequest(string Question);\n\n/// \u003Csummary\u003EBody of the claimant\u0027s answer to an open information request.\u003C/summary\u003E\npublic sealed record AnswerClaimInfoRequest(string Answer);\n\n/// \u003Csummary\u003EBody of a decision. \u003Cc\u003EAmountMinor\u003C/c\u003E is required to approve (0 \u0026lt; amount \u0026lt;= reserve) and must be absent to reject.\u003C/summary\u003E\npublic sealed record DecideClaimRequest(ClaimOutcome Outcome, string Reason, long? AmountMinor = null);\n\n/// \u003Csummary\u003EQuery parameters of the claims list, bound as one object (they stay flat in the URL and in OpenAPI). \u003Cc\u003EStatus\u003C/c\u003E repeats or is comma separated.\u003C/summary\u003E\npublic sealed record ClaimListFilter\n{\n    [FromQuery(Name = \u0022limit\u0022)]\n    public int? Limit { get; init; }\n\n    [FromQuery(Name = \u0022status\u0022)]\n    public string[]? Status { get; init; }\n\n    [FromQuery(Name = \u0022assigned\u0022)]\n    public string? Assigned { get; init; }\n\n    [FromQuery(Name = \u0022market\u0022)]\n    public string? Market { get; init; }\n\n    [FromQuery(Name = \u0022line\u0022)]\n    public string? Line { get; init; }\n\n    [FromQuery(Name = \u0022q\u0022)]\n    public string? Q { get; init; }\n\n    [FromQuery(Name = \u0022cursor\u0022)]\n    public string? Cursor { get; init; }\n\n    public Fugue.Application.Features.Claims.Queries.ListClaimsQuery ToQuery() =\u003E new(Limit, Status, Assigned, Market, Line, Q, Cursor);\n}\n","mutants":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Contracts/CustomerRequests.cs":{"language":"cs","source":"using Fugue.Application.Features.Customers.Queries;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace Fugue.Api.Contracts;\n\n/// \u003Csummary\u003EBody of a customer create. \u003Cc\u003EUserId\u003C/c\u003E (the owner) is honoured only for callers with effective CUSTOMERS_ALL.\u003C/summary\u003E\npublic sealed record CreateCustomerRequest(string Name, string Email, string? Phone, Guid? UserId = null);\n\n/// \u003Csummary\u003EBody of a customer replace; the route carries the id and \u003Cc\u003EIf-Match\u003C/c\u003E the version.\u003C/summary\u003E\npublic sealed record UpdateCustomerRequest(string Name, string Email, string? Phone);\n\n/// \u003Csummary\u003EQuery parameters of the customers list, bound as one object. \u003Cc\u003EStatus\u003C/c\u003E is Active or Suspended; \u003Cc\u003ESearch\u003C/c\u003E is a case-insensitive match over name and email.\u003C/summary\u003E\npublic sealed record CustomerListFilter\n{\n    [FromQuery(Name = \u0022limit\u0022)]\n    public int? Limit { get; init; }\n\n    [FromQuery(Name = \u0022status\u0022)]\n    public string? Status { get; init; }\n\n    [FromQuery(Name = \u0022search\u0022)]\n    public string? Search { get; init; }\n\n    [FromQuery(Name = \u0022cursor\u0022)]\n    public string? Cursor { get; init; }\n\n    public ListCustomersQuery ToQuery() =\u003E new(Limit, Status, Search, Cursor);\n}\n","mutants":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Contracts/WebhookRequests.cs":{"language":"cs","source":"using Fugue.Application.Features.Webhooks.Queries;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace Fugue.Api.Contracts;\n\n/// \u003Csummary\u003EBody of POST /webhooks/subscriptions. The secret is generated by the server.\u003C/summary\u003E\npublic sealed record CreateWebhookSubscriptionRequest(string Name, string Url, string[] EventTypes);\n\n/// \u003Csummary\u003EBody of PUT /webhooks/subscriptions/{id}. Requires If-Match. The secret is changed only by rotating it.\u003C/summary\u003E\npublic sealed record UpdateWebhookSubscriptionRequest(string Name, string Url, string[] EventTypes, bool IsActive);\n\n/// \u003Csummary\u003EBody of PUT /dev/webhook-sink/secret: the signing secret the Development sink should trust.\u003C/summary\u003E\npublic sealed record SetSinkSecretRequest(string Secret);\n\n/// \u003Csummary\u003EQuery parameters of the webhook deliveries list, bound as one object.\u003C/summary\u003E\npublic sealed record WebhookDeliveryListFilter\n{\n    [FromQuery(Name = \u0022status\u0022)]\n    public string? Status { get; init; }\n\n    [FromQuery(Name = \u0022subscriptionId\u0022)]\n    public Guid? SubscriptionId { get; init; }\n\n    [FromQuery(Name = \u0022eventType\u0022)]\n    public string? EventType { get; init; }\n\n    [FromQuery(Name = \u0022limit\u0022)]\n    public int? Limit { get; init; }\n\n    [FromQuery(Name = \u0022cursor\u0022)]\n    public string? Cursor { get; init; }\n\n    public ListWebhookDeliveriesQuery ToQuery() =\u003E new(Status, SubscriptionId, EventType, Limit, Cursor);\n}\n","mutants":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Controllers/ApiControllerBase.cs":{"language":"cs","source":"using System.Text;\nusing FluentResults;\nusing Fugue.Api.Http;\nusing Fugue.Domain.Abstractions;\nusing Fugue.Domain.Results;\nusing Mediator;\nusing Microsoft.AspNetCore.Http.Extensions;\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.AspNetCore.Mvc.ModelBinding;\nusing Microsoft.Extensions.Primitives;\n\nnamespace Fugue.Api.Controllers;\n\n/// \u003Csummary\u003E\n/// Base class for every controller. It owns the HTTP plumbing so actions stay one-line dispatches:\n/// \u003Cc\u003EFluentResults.Result\u0026lt;T\u0026gt;\u003C/c\u003E to response or RFC 9457 problem, ETag / \u003Cc\u003EIf-Match\u003C/c\u003E, keyset pagination headers,\n/// the idempotency key, the current user, and mediator dispatch.\n/// \u003C/summary\u003E\n/// \u003Cremarks\u003E\n/// Controllers deriving from this class declare no constructor. Every collaborator is resolved lazily from\n/// \u003Cc\u003EHttpContext.RequestServices\u003C/c\u003E, so adding a cross-cutting concern never touches a derived class.\n/// This type is a critical seam (see AGENTS.md review gate matrix).\n/// \u003C/remarks\u003E\n[ApiController]\n[Route(\u0022api/v1/[controller]\u0022)]\npublic abstract class ApiControllerBase : ControllerBase\n{\n    private const string ErrorTypeBase = \u0022https://fugue.dev/errors/\u0022;\n\n    private ISender? _sender;\n    private ICurrentUser? _currentUser;\n\n    /// \u003Csummary\u003EThe mediator, resolved on first use from the request scope.\u003C/summary\u003E\n    protected ISender Sender =\u003E _sender ??= HttpContext.RequestServices.GetRequiredService\u003CISender\u003E();\n\n    /// \u003Csummary\u003EThe authenticated caller, resolved on first use from the request scope.\u003C/summary\u003E\n    protected ICurrentUser CurrentUser =\u003E\n        _currentUser ??= HttpContext.RequestServices.GetRequiredService\u003CICurrentUser\u003E();\n\n    /// \u003Csummary\u003E\n    /// The \u003Cc\u003EIdempotency-Key\u003C/c\u003E request header, or null when absent or blank. This base class only\n    /// exposes the value; storing keys and replaying responses is the job of a dedicated idempotency\n    /// filter that runs before the action.\n    /// \u003C/summary\u003E\n    protected string? IdempotencyKey\n    {\n        get\n        {\n            string? value = Request.Headers[\u0022Idempotency-Key\u0022].FirstOrDefault();\n            return string.IsNullOrWhiteSpace(value) ? null : value.Trim();\n        }\n    }\n\n    /// \u003Csummary\u003E\n    /// The version in the \u003Cc\u003EIf-Match\u003C/c\u003E header (\u003Cc\u003E\u00225\u0022\u003C/c\u003E or \u003Cc\u003EW/\u00225\u0022\u003C/c\u003E), or null when the header is\n    /// absent, \u003Cc\u003E*\u003C/c\u003E, or not a number. Handlers decide whether a missing version is a\n    /// \u003Csee cref=\u0022ErrorType.PreconditionRequired\u0022/\u003E failure.\n    /// \u003C/summary\u003E\n    protected long? IfMatchVersion\n    {\n        get\n        {\n            string? raw = Request.Headers.IfMatch.FirstOrDefault();\n            if (string.IsNullOrWhiteSpace(raw))\n            {\n                return null;\n            }\n\n            string tag = raw.Split(\u0027,\u0027)[0].Trim();\n            if (tag.StartsWith(\u0022W/\u0022, StringComparison.OrdinalIgnoreCase))\n            {\n                tag = tag[2..];\n            }\n\n            tag = tag.Trim(\u0027\u0022\u0027);\n            return long.TryParse(tag, out long version) ? version : null;\n        }\n    }\n\n    // Return types are ActionResult\u003CT\u003E (not IActionResult) so OpenAPI generators infer the 200/201 body\n    // schema from the action signature without a [ProducesResponseType] on every action. Failures are\n    // ProblemResult, which is an ActionResult, so the one-liner action style is unchanged.\n    //\n    // Mediator keeps ICommand\u003CT\u003E, IQuery\u003CT\u003E and IRequest\u003CT\u003E as separate hierarchies, so each helper has an\n    // overload per hierarchy; all of them funnel into one private mapper.\n\n    /// \u003Csummary\u003E200 with the value as the body, plus an \u003Cc\u003EETag\u003C/c\u003E when the value is \u003Csee cref=\u0022IVersioned\u0022/\u003E.\u003C/summary\u003E\n    protected async Task\u003CActionResult\u003CT\u003E\u003E Send\u003CT\u003E(IRequest\u003CResult\u003CT\u003E\u003E request, CancellationToken ct) =\u003E\n        ToOk(await Sender.Send(request, ct));\n\n    /// \u003Cinheritdoc cref=\u0022Send{T}(IRequest{Result{T}}, CancellationToken)\u0022/\u003E\n    protected async Task\u003CActionResult\u003CT\u003E\u003E Send\u003CT\u003E(ICommand\u003CResult\u003CT\u003E\u003E command, CancellationToken ct) =\u003E\n        ToOk(await Sender.Send(command, ct));\n\n    /// \u003Cinheritdoc cref=\u0022Send{T}(IRequest{Result{T}}, CancellationToken)\u0022/\u003E\n    protected async Task\u003CActionResult\u003CT\u003E\u003E Send\u003CT\u003E(IQuery\u003CResult\u003CT\u003E\u003E query, CancellationToken ct) =\u003E\n        ToOk(await Sender.Send(query, ct));\n\n    /// \u003Csummary\u003E201 with a \u003Cc\u003ELocation\u003C/c\u003E built from \u003Cparamref name=\u0022actionName\u0022/\u003E and an \u003Cc\u003EETag\u003C/c\u003E when versioned.\u003C/summary\u003E\n    protected async Task\u003CActionResult\u003CT\u003E\u003E SendCreated\u003CT\u003E(\n        IRequest\u003CResult\u003CT\u003E\u003E request,\n        string actionName,\n        Func\u003CT, object\u003E routeValues,\n        CancellationToken ct) =\u003E\n        ToCreated(await Sender.Send(request, ct), actionName, routeValues);\n\n    /// \u003Cinheritdoc cref=\u0022SendCreated{T}(IRequest{Result{T}}, string, Func{T, object}, CancellationToken)\u0022/\u003E\n    protected async Task\u003CActionResult\u003CT\u003E\u003E SendCreated\u003CT\u003E(\n        ICommand\u003CResult\u003CT\u003E\u003E command,\n        string actionName,\n        Func\u003CT, object\u003E routeValues,\n        CancellationToken ct) =\u003E\n        ToCreated(await Sender.Send(command, ct), actionName, routeValues);\n\n    /// \u003Csummary\u003E204 on success.\u003C/summary\u003E\n    protected async Task\u003CIActionResult\u003E SendNoContent(IRequest\u003CResult\u003E request, CancellationToken ct) =\u003E\n        ToNoContent(await Sender.Send(request, ct));\n\n    /// \u003Cinheritdoc cref=\u0022SendNoContent(IRequest{Result}, CancellationToken)\u0022/\u003E\n    protected async Task\u003CIActionResult\u003E SendNoContent(ICommand\u003CResult\u003E command, CancellationToken ct) =\u003E\n        ToNoContent(await Sender.Send(command, ct));\n\n    /// \u003Csummary\u003E\n    /// 204 for a mutation whose handler returns the updated resource: the body is dropped, but when the value is\n    /// \u003Csee cref=\u0022IVersioned\u0022/\u003E its new version still goes out as \u003Cc\u003EETag\u003C/c\u003E so the client can chain If-Match.\n    /// \u003C/summary\u003E\n    protected async Task\u003CIActionResult\u003E SendNoContent\u003CT\u003E(ICommand\u003CResult\u003CT\u003E\u003E command, CancellationToken ct) =\u003E\n        ToNoContent(await Sender.Send(command, ct));\n\n    /// \u003Csummary\u003E\n    /// 200 with the items array as the body. When another page exists, adds \u003Cc\u003EX-Next-Cursor\u003C/c\u003E and an\n    /// RFC 8288 \u003Cc\u003ELink: \u0026lt;url\u0026gt;; rel=\u0022next\u0022\u003C/c\u003E built from the current request URL.\n    /// \u003C/summary\u003E\n    protected async Task\u003CActionResult\u003CIReadOnlyList\u003CT\u003E\u003E\u003E SendPaged\u003CT\u003E(\n        IRequest\u003CResult\u003CPagedResult\u003CT\u003E\u003E\u003E request,\n        CancellationToken ct) =\u003E\n        ToPage(await Sender.Send(request, ct));\n\n    /// \u003Cinheritdoc cref=\u0022SendPaged{T}(IRequest{Result{PagedResult{T}}}, CancellationToken)\u0022/\u003E\n    protected async Task\u003CActionResult\u003CIReadOnlyList\u003CT\u003E\u003E\u003E SendPaged\u003CT\u003E(\n        IQuery\u003CResult\u003CPagedResult\u003CT\u003E\u003E\u003E query,\n        CancellationToken ct) =\u003E\n        ToPage(await Sender.Send(query, ct));\n\n    private ActionResult\u003CT\u003E ToOk\u003CT\u003E(Result\u003CT\u003E result)\n    {\n        if (result.IsFailed)\n        {\n            return Problem(result.Errors[0]);\n        }\n\n        SetETag(result.Value);\n        return Ok(result.Value);\n    }\n\n    private ActionResult\u003CT\u003E ToCreated\u003CT\u003E(Result\u003CT\u003E result, string actionName, Func\u003CT, object\u003E routeValues)\n    {\n        if (result.IsFailed)\n        {\n            return Problem(result.Errors[0]);\n        }\n\n        SetETag(result.Value);\n        return CreatedAtAction(actionName, routeValues(result.Value), result.Value);\n    }\n\n    private IActionResult ToNoContent(Result result) =\u003E\n        result.IsFailed ? Problem(result.Errors[0]) : NoContent();\n\n    private IActionResult ToNoContent\u003CT\u003E(Result\u003CT\u003E result)\n    {\n        if (result.IsFailed)\n        {\n            return Problem(result.Errors[0]);\n        }\n\n        SetETag(result.Value);\n        return NoContent();\n    }\n\n    private ActionResult\u003CIReadOnlyList\u003CT\u003E\u003E ToPage\u003CT\u003E(Result\u003CPagedResult\u003CT\u003E\u003E result)\n    {\n        if (result.IsFailed)\n        {\n            return Problem(result.Errors[0]);\n        }\n\n        PagedResult\u003CT\u003E page = result.Value;\n        if (page.NextCursor is not null)\n        {\n            Response.Headers[\u0022X-Next-Cursor\u0022] = page.NextCursor;\n            Response.Headers.Append(\u0022Link\u0022, $\u0022\u003C{BuildNextLink(page.NextCursor)}\u003E; rel=\\\u0022next\\\u0022\u0022);\n        }\n\n        return Ok(page.Items);\n    }\n\n    /// \u003Csummary\u003E\n    /// Maps a failure to an RFC 9457 problem. A \u003Csee cref ,"mutatorName":"Boolean mutation","replacement":"true","location":{"start":{"line":310,"column":27},"end":{"line":310,"column":32}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"485","mutatorName":"Statement mutation","replacement":";","location":{"start":{"line":311,"column":13},"end":{"line":311,"column":54}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"486","mutatorName":"Linq method mutation (Append() to Prepend())","replacement":"builder.Prepend","location":{"start":{"line":311,"column":13},"end":{"line":311,"column":27}},"status":"CompileError","statusReason":"Mutant caused compile errors","static":false,"coveredBy":[],"killedBy":[]}]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Controllers/AuditController.cs":{"language":"cs","source":"using Fugue.Api.Auth;\nusing Fugue.Api.Contracts;\nusing Fugue.Api.Modules;\nusing Fugue.Api.OpenApi;\nusing Fugue.Application.Features.Audit;\nusing Fugue.Domain.Identity;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace Fugue.Api.Controllers;\n\n/// \u003Csummary\u003E\n/// The audit log (ADR-010): read-only, newest first, keyset paged. There is no write, update or delete endpoint, and the table\n/// refuses them anyway (append-only trigger). One-liners only.\n/// \u003C/summary\u003E\n[Module(ModuleCodes.Audit)]\npublic sealed class AuditController : ApiControllerBase\n{\n    /// \u003Csummary\u003EList audit rows, newest first, keyset paged. Every filter is optional and they combine.\u003C/summary\u003E\n    [HttpGet]\n    [HasPermission(Permissions.AuditRead)]\n    [ProducesResponseType(typeof(IReadOnlyList\u003CAuditLogDto\u003E), StatusCodes.Status200OK)]\n    public Task\u003CActionResult\u003CIReadOnlyList\u003CAuditLogDto\u003E\u003E\u003E List([FromQuery] AuditListFilter filter, CancellationToken ct) =\u003E\n        SendPaged(filter.ToQuery(), ct);\n}\n","mutants":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Controllers/AuthController.cs":{"language":"cs","source":"using Fugue.Api.Auth;\nusing Fugue.Api.Contracts;\nusing Fugue.Api.OpenApi;\nusing Fugue.Application.Abstractions;\nusing Fugue.Application.Features.Auth;\nusing Fugue.Application.Features.Auth.Commands;\nusing Microsoft.AspNetCore.Authorization;\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.AspNetCore.RateLimiting;\n\nnamespace Fugue.Api.Controllers;\n\n/// \u003Csummary\u003EToken issuance. Anonymous by necessity; both rate limits run before any password work.\u003C/summary\u003E\npublic sealed class AuthController : ApiControllerBase\n{\n    /// \u003Csummary\u003EExchange an email and password for an access token and a refresh token. Rate limited per client address and per email.\u003C/summary\u003E\n    [HttpPost(\u0022token\u0022)]\n    [ProducesResponseType(typeof(TokenDto), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status401Unauthorized, \u0022auth.invalid_credentials\u0022)]\n    [AllowAnonymous]\n    [EnableRateLimiting(AuthRateLimiting.IpPolicy)]\n    [ServiceFilter(typeof(EmailRateLimitFilter))]\n    public Task\u003CActionResult\u003CTokenDto\u003E\u003E Token(LoginRequest body, CancellationToken ct) =\u003E\n        Send(new LoginCommand(body.Email, body.Password, Client()), ct);\n\n    /// \u003Csummary\u003ERotates a refresh token. The refresh token IS the credential, so this is anonymous; the per-IP rate limit applies.\u003C/summary\u003E\n    [HttpPost(\u0022refresh\u0022)]\n    [ProducesResponseType(typeof(TokenDto), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status401Unauthorized, \u0022auth.invalid_refresh_token\u0022)]\n    [AllowAnonymous]\n    [EnableRateLimiting(AuthRateLimiting.IpPolicy)]\n    public Task\u003CActionResult\u003CTokenDto\u003E\u003E Refresh(RefreshRequest body, CancellationToken ct) =\u003E\n        Send(new RefreshTokenCommand(body.RefreshToken, Client()), ct);\n\n    /// \u003Csummary\u003EEnds the session by revoking the token\u0027s whole family. Always 204.\u003C/summary\u003E\n    [HttpPost(\u0022logout\u0022)]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    [AllowAnonymous]\n    [EnableRateLimiting(AuthRateLimiting.IpPolicy)]\n    public Task\u003CIActionResult\u003E Logout(LogoutRequest body, CancellationToken ct) =\u003E\n        SendNoContent(new LogoutCommand(body.RefreshToken, Client()), ct);\n\n    private ClientInfo Client() =\u003E\n        new(HttpContext.Connection.RemoteIpAddress?.ToString(), Request.Headers.UserAgent.ToString() is { Length: \u003E 0 } ua ? ua[..Math.Min(ua.Length, 256)] : null);\n}\n","mutants":[{"id":"487","mutatorName":"Conditional (true) mutation","replacement":"(true?ua[..Math.Min(ua.Length, 256)] :null)","location":{"start":{"line":44,"column":65},"end":{"line":44,"column":163}},"status":"CompileError","statusReason":"Mutant caused compile errors","static":false,"coveredBy":[],"killedBy":[]},{"id":"488","mutatorName":"Conditional (false) mutation","replacement":"(false?ua[..Math.Min(ua.Length, 256)] :null)","location":{"start":{"line":44,"column":65},"end":{"line":44,"column":163}},"status":"CompileError","statusReason":"Mutant caused compile errors","static":false,"coveredBy":[],"killedBy":[]},{"id":"489","mutatorName":"Equality mutation","replacement":"Request.Headers.UserAgent.ToString() is not { Length: \u003E 0 } ua","location":{"start":{"line":44,"column":65},"end":{"line":44,"column":123}},"status":"CompileError","statusReason":"Mutant caused compile errors","static":false,"coveredBy":[],"killedBy":[]},{"id":"490","mutatorName":"Equality mutation","replacement":"\u003C 0","location":{"start":{"line":44,"column":115},"end":{"line":44,"column":118}},"status":"CompileError","statusReason":"Mutant caused compile errors","static":false,"coveredBy":[],"killedBy":[]},{"id":"491","mutatorName":"Equality mutation","replacement":"\u003E= 0","location":{"start":{"line":44,"column":115},"end":{"line":44,"column":118}},"status":"CompileError","statusReason":"Mutant caused compile errors","static":false,"coveredBy":[],"killedBy":[]},{"id":"492","mutatorName":"Linq method mutation (Min() to Max())","replacement":"Math.Max","location":{"start":{"line":44,"column":131},"end":{"line":44,"column":139}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]}]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Controllers/ClaimsController.cs":{"language":"cs","source":"using Fugue.Api.Auth;\nusing Fugue.Api.Contracts;\nusing Fugue.Api.Idempotency;\nusing Fugue.Api.Modules;\nusing Fugue.Api.OpenApi;\nusing Fugue.Application.Features.Claims;\nusing Fugue.Application.Features.Claims.Commands;\nusing Fugue.Application.Features.Claims.Queries;\nusing Fugue.Domain.Identity;\nusing Fugue.Domain.Ids;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace Fugue.Api.Controllers;\n\n/// \u003Csummary\u003E\n/// Claims: submit, queue, handle, decide and settle (W-020, D-053). One-liners only; the state machine lives in the Claim aggregate. A claimant sees only\n/// their own claims (anything else is 404, never 403) and never the internal reserve. Every mutating action after submit takes \u003Cc\u003EIf-Match\u003C/c\u003E and answers\n/// with the claim as it now stands plus its new ETag.\n/// \u003C/summary\u003E\n[Module(ModuleCodes.Claims)]\npublic sealed class ClaimsController : ApiControllerBase\n{\n    /// \u003Csummary\u003ESubmit a claim. The caller is the claimant; the claim starts Submitted. The incident date may not be in the future or more than a year back.\u003C/summary\u003E\n    [HttpPost]\n    [HasPermission(Permissions.ClaimsSubmit)]\n    [Idempotent(Required = true)]\n    [ProducesResponseType(typeof(ClaimDto), StatusCodes.Status201Created)]\n    public Task\u003CActionResult\u003CClaimDto\u003E\u003E Submit(SubmitClaimRequest body, CancellationToken ct) =\u003E\n        SendCreated(\n            new SubmitClaimCommand(body.Market, body.Line, body.PolicyNumber, body.IncidentDate, body.IncidentDescription, body.IncidentLocation),\n            nameof(Get), c =\u003E new { id = c.Id }, ct);\n\n    /// \u003Csummary\u003E\n    /// List claims, keyset paged. A claimant sees their own, newest first; staff with CLAIMS_ALL see every claim, oldest first (the work queue).\n    /// Filter by \u0060status\u0060 (repeat it or comma separate), \u0060assigned\u0060 (me, none, any), \u0060market\u0060, \u0060line\u0060 and \u0060q\u0060 (claim number or policy number).\n    /// \u003C/summary\u003E\n    [HttpGet]\n    [HasPermission(Permissions.ClaimsRead)]\n    [ProducesResponseType(typeof(IReadOnlyList\u003CClaimDto\u003E), StatusCodes.Status200OK)]\n    public Task\u003CActionResult\u003CIReadOnlyList\u003CClaimDto\u003E\u003E\u003E List([FromQuery] ClaimListFilter filter, CancellationToken ct) =\u003E\n        SendPaged(filter.ToQuery(), ct);\n\n    /// \u003Csummary\u003EWorkload board: per officer the open claims by status, the oldest open age, decisions in the last 7 and 30 days and the median days to decide; the unassigned count; ageing bands 0-2, 3-7, 8-14, 15\u002B days.\u003C/summary\u003E\n    [HttpGet(\u0022workload\u0022)]\n    [HasPermission(Permissions.ClaimsWorkload)]\n    [ProducesResponseType(typeof(ClaimWorkloadDto), StatusCodes.Status200OK)]\n    public Task\u003CActionResult\u003CClaimWorkloadDto\u003E\u003E Workload(CancellationToken ct) =\u003E\n        Send(new GetClaimWorkloadQuery(), ct);\n\n    /// \u003Csummary\u003EExposure: per market, line and currency the open count, the outstanding reserve of open claims and the approved-not-settled amount. Totals are per currency; amounts are never added across currencies.\u003C/summary\u003E\n    [HttpGet(\u0022exposure\u0022)]\n    [HasPermission(Permissions.ClaimsExposure)]\n    [ProducesResponseType(typeof(ClaimExposureDto), StatusCodes.Status200OK)]\n    public Task\u003CActionResult\u003CClaimExposureDto\u003E\u003E Exposure(CancellationToken ct) =\u003E\n        Send(new GetClaimExposureQuery(), ct);\n\n    /// \u003Csummary\u003EGet one claim with its open question, if any. Your own claim, or any claim with CLAIMS_ALL; anything else is 404.\u003C/summary\u003E\n    [HttpGet(\u0022{id}\u0022)]\n    [HasPermission(Permissions.ClaimsRead)]\n    [ProducesResponseType(typeof(ClaimDto), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022claim.not_found\u0022)]\n    public Task\u003CActionResult\u003CClaimDto\u003E\u003E Get(ClaimId id, CancellationToken ct) =\u003E\n        Send(new GetClaimByIdQuery(id), ct);\n\n    /// \u003Csummary\u003EThe claim\u0027s history, oldest first, with claimant-safe notes. Same visibility as the claim.\u003C/summary\u003E\n    [HttpGet(\u0022{id}/timeline\u0022)]\n    [HasPermission(Permissions.ClaimsRead)]\n    [ProducesResponseType(typeof(IReadOnlyList\u003CClaimTimelineEntryDto\u003E), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022claim.not_found\u0022)]\n    public Task\u003CActionResult\u003CIReadOnlyList\u003CClaimTimelineEntryDto\u003E\u003E\u003E Timeline(ClaimId id, CancellationToken ct) =\u003E\n        Send(new GetClaimTimelineQuery(id), ct);\n\n    /// \u003Csummary\u003EPick up a Submitted claim: it becomes UnderReview and you become its assigned officer.\u003C/summary\u003E\n    [HttpPost(\u0022{id}/pickup\u0022)]\n    [HasPermission(Permissions.ClaimsHandle)]\n    [IfMatch]\n    [ProducesResponseType(typeof(ClaimDto), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022claim.not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022claim.invalid_transition\u0022)]\n    public Task\u003CActionResult\u003CClaimDto\u003E\u003E Pickup(ClaimId id, CancellationToken ct) =\u003E\n        Send(new PickupClaimCommand(id, IfMatchVersion), ct);\n\n    /// \u003Csummary\u003ESet the internal reserve (minor units) while the claim is UnderReview or InfoRequested. Never shown to the claimant. Assigned officer or manager only.\u003C/summary\u003E\n    [HttpPut(\u0022{id}/reserve\u0022)]\n    [HasPermission(Permissions.ClaimsHandle)]\n    [IfMatch]\n    [ProducesResponseType(typeof(ClaimDto), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022claim.not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022claim.invalid_transition\u0022, \u0022claim.not_assigned_to_you\u0022)]\n    public Task\u003CActionResult\u003CClaimDto\u003E\u003E SetReserve(ClaimId id, SetClaimReserveRequest body, CancellationToken ct) =\u003E\n        Send(new ReserveClaimCommand(id, body.AmountMinor, IfMatchVersion), ct);\n\n    /// \u003Csummary\u003EAsk the claimant a question: UnderReview becomes InfoRequested. One open question at a time. Assigned officer or manager only.\u003C/summary\u003E\n    [HttpPost(\u0022{id}/info-requests\u0022)]\n    [HasPermission(Permissions.ClaimsHandle)]\n    [IfMatch]\n    [ProducesResponseType(typeof(ClaimDto), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022claim.not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022claim.invalid_transition\u0022, \u0022claim.not_assigned_to_you\u0022)]\n    public Task\u003CActionResult\u003CClaimDto\u003E\u003E RequestInfo(ClaimId id, RequestClaimInfoRequest body, CancellationToken ct) =\u003E\n        Send(new RequestClaimInfoCommand(id, body.Question, IfMatchVersion), ct);\n\n    /// \u003Csummary\u003EAnswer the open question on your own claim: InfoRequested becomes UnderReview.\u003C/summary\u003E\n    [HttpPost(\u0022{id}/info-requests/{requestId}/response\u0022)]\n    [HasPermission(Permissions.ClaimsRespond)]\n    [IfMatch]\n    [ProducesResponseType(typeof(ClaimDto), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022claim.not_found\u0022, \u0022claim.info_request_not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022claim.invalid_transition\u0022)]\n    public Task\u003CActionResult\u003CClaimDto\u003E\u003E Respond(ClaimId id, ClaimInfoRequestId requestId, AnswerClaimInfoRequest body, CancellationToken ct) =\u003E\n        Send(new RespondToClaimInfoCommand(id, requestId, body.Answer, IfMatchVersion), ct);\n\n    /// \u003Csummary\u003E\n    /// Approve or reject a claim under review. Approving needs a reserve (409 \u0060claim.reserve_required\u0060) and an amount with 0 \u0026lt; amount \u0026lt;= reserve\n    /// (400 \u0060claim.amount_invalid\u0060); the reason is shown to the claimant. Assigned officer or manager only.\n    /// \u003C/summary\u003E\n    [HttpPost(\u0022{id}/decision\u0022)]\n    [HasPermission(Permissions.ClaimsHandle)]\n    [IfMatch]\n    [ProducesResponseType(typeof(ClaimDto), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022claim.not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022claim.invalid_transition\u0022, \u0022claim.reserve_required\u0022, \u0022claim.not_assigned_to_you\u0022)]\n    public Task\u003CActionResult\u003CClaimDto\u003E\u003E Decide(ClaimId id, DecideClaimRequest body, CancellationToken ct) =\u003E\n        Send(new DecideClaimCommand(id, body.Outcome, body.AmountMinor, body.Reason, IfMatchVersion), ct);\n\n    /// \u003Csummary\u003ESettle an Approved claim. Needs CLAIMS_SETTLE (managers).\u003C/summary\u003E\n    [HttpPost(\u0022{id}/settle\u0022)]\n    [HasPermission(Permissions.ClaimsSettle)]\n    [IfMatch]\n    [ProducesResponseType(typeof(ClaimDto), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022claim.not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022claim.invalid_transition\u0022)]\n    public Task\u003CActionResult\u003CClaimDto\u003E\u003E Settle(ClaimId id, CancellationToken ct) =\u003E\n        Send(new SettleClaimCommand(id, IfMatchVersion), ct);\n}\n","mutants":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Controllers/CustomersController.cs":{"language":"cs","source":"using Fugue.Api.Auth;\nusing Fugue.Api.Contracts;\nusing Fugue.Api.Idempotency;\nusing Fugue.Api.Modules;\nusing Fugue.Api.OpenApi;\nusing Fugue.Application.Features.Customers;\nusing Fugue.Application.Features.Customers.Commands;\nusing Fugue.Application.Features.Customers.Queries;\nusing Fugue.Domain.Identity;\nusing Fugue.Domain.Ids;\nusing Fugue.Domain.Results;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace Fugue.Api.Controllers;\n\n/// \u003Csummary\u003ECustomers: a stateful aggregate rehearsing ETag/If-Match, keyset paging and guarded transitions. One-liners only.\u003C/summary\u003E\n[Module(ModuleCodes.Customers)]\npublic sealed class CustomersController : ApiControllerBase\n{\n    /// \u003Csummary\u003ECreate a customer. A \u0060userId\u0060 in the body (the owner) is honoured only for callers with CUSTOMERS_ALL; otherwise the caller owns it.\u003C/summary\u003E\n    [HttpPost]\n    [HasPermission(Permissions.CustomersInsert)]\n    [Idempotent]\n    [ProducesResponseType(typeof(CustomerDto), StatusCodes.Status201Created)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022customer.email_taken\u0022)]\n    public Task\u003CActionResult\u003CCustomerDto\u003E\u003E Create(CreateCustomerRequest body, CancellationToken ct) =\u003E\n        SendCreated(new CreateCustomerCommand(body.Name, body.Email, body.Phone, body.UserId), nameof(Get), c =\u003E new { id = c.Id }, ct);\n\n    /// \u003Csummary\u003EGet one customer. A self-service caller sees only their own; anything else is 404, never 403.\u003C/summary\u003E\n    [HttpGet(\u0022{id}\u0022)]\n    [HasPermission(Permissions.CustomersView)]\n    [ProducesResponseType(typeof(CustomerDto), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022customer.not_found\u0022)]\n    public Task\u003CActionResult\u003CCustomerDto\u003E\u003E Get(CustomerId id, CancellationToken ct) =\u003E\n        Send(new GetCustomerByIdQuery(id), ct);\n\n    /// \u003Csummary\u003EList customers, newest first, keyset paged. Filter by \u0060status\u0060 (Active or Suspended) and a case-insensitive \u0060search\u0060 over name and email.\u003C/summary\u003E\n    [HttpGet]\n    [HasPermission(Permissions.CustomersView)]\n    [ProducesResponseType(typeof(IReadOnlyList\u003CCustomerDto\u003E), StatusCodes.Status200OK)]\n    public Task\u003CActionResult\u003CIReadOnlyList\u003CCustomerDto\u003E\u003E\u003E List([FromQuery] CustomerListFilter filter, CancellationToken ct) =\u003E\n        SendPaged(filter.ToQuery(), ct);\n\n    /// \u003Csummary\u003EReplace a customer\u0027s name, email and phone. Changing the email needs staff access (403 \u0060customer.email_change_forbidden\u0060 otherwise).\u003C/summary\u003E\n    [HttpPut(\u0022{id}\u0022)]\n    [HasPermission(Permissions.CustomersEdit)]\n    [IfMatch]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022customer.not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022customer.email_taken\u0022)]\n    public Task\u003CIActionResult\u003E Update(CustomerId id, UpdateCustomerRequest body, CancellationToken ct) =\u003E\n        SendNoContent(new UpdateCustomerCommand(id, body.Name, body.Email, body.Phone, IfMatchVersion), ct);\n\n    /// \u003Csummary\u003ESuspend an active customer.\u003C/summary\u003E\n    [HttpPost(\u0022{id}/suspend\u0022)]\n    [HasPermission(Permissions.CustomersSuspend)]\n    [IfMatch]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022customer.not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022customer.invalid_transition\u0022)]\n    public Task\u003CIActionResult\u003E Suspend(CustomerId id, CancellationToken ct) =\u003E\n        SendNoContent(new SuspendCustomerCommand(id, IfMatchVersion), ct);\n\n    /// \u003Csummary\u003EReactivate a suspended customer.\u003C/summary\u003E\n    [HttpPost(\u0022{id}/reactivate\u0022)]\n    [HasPermission(Permissions.CustomersSuspend)]\n    [IfMatch]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022customer.not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022customer.invalid_transition\u0022)]\n    public Task\u003CIActionResult\u003E Reactivate(CustomerId id, CancellationToken ct) =\u003E\n        SendNoContent(new ReactivateCustomerCommand(id, IfMatchVersion), ct);\n\n    /// \u003Csummary\u003ESoft-delete a customer; it then answers 404.\u003C/summary\u003E\n    [HttpDelete(\u0022{id}\u0022)]\n    [HasPermission(Permissions.CustomersDelete)]\n    [IfMatch]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022customer.not_found\u0022)]\n    public Task\u003CIActionResult\u003E Delete(CustomerId id, CancellationToken ct) =\u003E\n        SendNoContent(new DeleteCustomerCommand(id, IfMatchVersion), ct);\n}\n","mutants":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Controllers/DevWebhookSinkController.cs":{"language":"cs","source":"using Fugue.Api.Auth;\nusing Fugue.Api.Contracts;\nusing Fugue.Api.Http;\nusing Fugue.Api.Modules;\nusing Fugue.Api.OpenApi;\nusing Fugue.Application.Features.Webhooks.Sink;\nusing Fugue.Domain.Identity;\nusing Microsoft.AspNetCore.Authorization;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace Fugue.Api.Controllers;\n\n/// \u003Csummary\u003E\n/// A receiver for the signed webhooks, for ONE-process demos (ADR-011, D-040). Development only: any other environment answers 404.\n/// \u003Cc\u003EPOST\u003C/c\u003E is anonymous on purpose (the sender has no JWT; the signature is the credential) and implements the receiver algorithm from the runbook:\n/// verify, reject stale timestamps, dedupe on the event id. Tell it the secret with \u003Cc\u003EPUT .../secret\u003C/c\u003E, read what arrived with \u003Cc\u003EGET\u003C/c\u003E.\n/// \u003C/summary\u003E\n[Module(ModuleCodes.Webhooks)]\n[DevelopmentOnly]\npublic sealed class DevWebhookSinkController : ApiControllerBase\n{\n    /// \u003Csummary\u003EThe receiving end of a signed webhook. Anonymous: the signature is the credential.\u003C/summary\u003E\n    [HttpPost(\u0022~/api/v1/dev/webhook-sink\u0022)]\n    [AllowAnonymous]\n    [ProducesResponseType(typeof(DevWebhookReceiptDto), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status401Unauthorized, \u0022sink.bad_signature\u0022, \u0022sink.stale_timestamp\u0022, \u0022sink.malformed\u0022, \u0022sink.envelope_mismatch\u0022)]\n    [ProblemResponse(StatusCodes.Status503ServiceUnavailable, \u0022sink.no_secret\u0022)]\n    public async Task\u003CActionResult\u003CDevWebhookReceiptDto\u003E\u003E Receive(CancellationToken ct) =\u003E\n        await Send(\n            new ReceiveDevWebhookRequest(\n                Header(\u0022X-Fugue-Event-Id\u0022), Header(\u0022X-Fugue-Event-Type\u0022), Header(\u0022X-Fugue-Timestamp\u0022), Header(\u0022X-Fugue-Signature\u0022),\n                Header(\u0022X-Correlation-Id\u0022), Header(\u0022X-Saga-Id\u0022), Header(\u0022traceparent\u0022),\n                await Request.ReadBodyAsync(ReceiveDevWebhookValidator.MaxBodyBytes, ct)),\n            ct);\n\n    /// \u003Csummary\u003EThe events the sink accepted, newest first.\u003C/summary\u003E\n    [HttpGet(\u0022~/api/v1/dev/webhook-sink\u0022)]\n    [HasPermission(Permissions.WebhooksManage)]\n    [ProducesResponseType(typeof(IReadOnlyList\u003CReceivedWebhookDto\u003E), StatusCodes.Status200OK)]\n    public Task\u003CActionResult\u003CIReadOnlyList\u003CReceivedWebhookDto\u003E\u003E\u003E List([FromQuery] int? limit, CancellationToken ct) =\u003E\n        Send(new ListDevWebhookSinkRequest(limit), ct);\n\n    /// \u003Csummary\u003ETell the sink which secret to trust.\u003C/summary\u003E\n    [HttpPut(\u0022~/api/v1/dev/webhook-sink/secret\u0022)]\n    [HasPermission(Permissions.WebhooksManage)]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    public Task\u003CIActionResult\u003E SetSecret(SetSinkSecretRequest body, CancellationToken ct) =\u003E\n        SendNoContent(new SetDevWebhookSinkSecretRequest(body.Secret), ct);\n\n    /// \u003Csummary\u003EForget the received events.\u003C/summary\u003E\n    [HttpDelete(\u0022~/api/v1/dev/webhook-sink\u0022)]\n    [HasPermission(Permissions.WebhooksManage)]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    public Task\u003CIActionResult\u003E Clear(CancellationToken ct) =\u003E\n        SendNoContent(new ClearDevWebhookSinkRequest(), ct);\n\n    private string? Header(string name) =\u003E Request.Headers[name].FirstOrDefault();\n}\n","mutants":[{"id":"493","mutatorName":"String mutation","replacement":"\u0022\u0022","location":{"start":{"line":31,"column":24},"end":{"line":31,"column":42}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"494","mutatorName":"String mutation","replacement":"\u0022\u0022","location":{"start":{"line":31,"column":52},"end":{"line":31,"column":72}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"495","mutatorName":"String mutation","replacement":"\u0022\u0022","location":{"start":{"line":31,"column":82},"end":{"line":31,"column":101}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"496","mutatorName":"String mutation","replacement":"\u0022\u0022","location":{"start":{"line":31,"column":111},"end":{"line":31,"column":130}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"cove romQuery] int count, CancellationToken ct) =\u003E\n        Send(new PingQuery(count), ct);\n}\n","mutants":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Controllers/GroupsController.cs":{"language":"cs","source":"using Fugue.Api.Auth;\nusing Fugue.Api.Modules;\nusing Fugue.Api.OpenApi;\nusing Fugue.Application.Features.Groups;\nusing Fugue.Application.Features.Groups.Commands;\nusing Fugue.Application.Features.Groups.Queries;\nusing Fugue.Domain.Identity;\nusing Fugue.Domain.Ids;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace Fugue.Api.Controllers;\n\n/// \u003Csummary\u003EGroups: members inherit the group\u0027s roles. Minimal administration; every change writes a grant_audit row.\u003C/summary\u003E\n[Module(ModuleCodes.Identity)]\npublic sealed class GroupsController : ApiControllerBase\n{\n    /// \u003Csummary\u003EList groups with their roles and member counts.\u003C/summary\u003E\n    [HttpGet]\n    [HasPermission(Permissions.GroupsView)]\n    [ProducesResponseType(typeof(IReadOnlyList\u003CGroupDto\u003E), StatusCodes.Status200OK)]\n    public Task\u003CActionResult\u003CIReadOnlyList\u003CGroupDto\u003E\u003E\u003E List(CancellationToken ct) =\u003E\n        Send(new ListGroupsQuery(), ct);\n\n    /// \u003Csummary\u003EAdd a user to a group (idempotent). You cannot change your own membership.\u003C/summary\u003E\n    [HttpPut(\u0022{code}/members/{userId}\u0022)]\n    [HasPermission(Permissions.GroupsManage)]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022group.not_found\u0022, \u0022user.not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022group.self_target\u0022)]\n    public Task\u003CIActionResult\u003E AddMember(string code, UserId userId, CancellationToken ct) =\u003E\n        SendNoContent(new AddGroupMemberCommand(code, userId), ct);\n\n    /// \u003Csummary\u003ERemove a user from a group. You cannot change your own membership.\u003C/summary\u003E\n    [HttpDelete(\u0022{code}/members/{userId}\u0022)]\n    [HasPermission(Permissions.GroupsManage)]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022group.not_found\u0022, \u0022group.member_not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022group.self_target\u0022)]\n    public Task\u003CIActionResult\u003E RemoveMember(string code, UserId userId, CancellationToken ct) =\u003E\n        SendNoContent(new RemoveGroupMemberCommand(code, userId), ct);\n}\n","mutants":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Controllers/MeController.cs":{"language":"cs","source":"using Fugue.Api.Modules;\nusing Fugue.Api.OpenApi;\nusing Fugue.Application.Features.Me;\nusing Fugue.Application.Features.Me.Queries;\nusing Fugue.Domain.Identity;\nusing Microsoft.AspNetCore.Authorization;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace Fugue.Api.Controllers;\n\n/// \u003Csummary\u003EThe signed-in caller\u0027s own identity and effective access. Needs no permission: every authenticated user may read their own.\u003C/summary\u003E\n[Module(ModuleCodes.System)]\npublic sealed class MeController : ApiControllerBase\n{\n    /// \u003Csummary\u003EThe caller\u0027s identity, roles, groups, effective permission codes and the enabled modules.\u003C/summary\u003E\n    /// \u003Cremarks\u003E\n    /// Drives the console\u0027s navigation and permission checks. The permission list is exactly what the API enforces (deny beats allow beats role;\n    /// permissions of a disabled module are absent), looked up fresh on every call and never cached by clients or proxies.\n    /// \u003C/remarks\u003E\n    [HttpGet]\n    [Authorize]\n    [ResponseCache(NoStore = true, Location = ResponseCacheLocation.None)]\n    [ProducesResponseType(typeof(MeDto), StatusCodes.Status200OK)]\n    public Task\u003CActionResult\u003CMeDto\u003E\u003E Get(CancellationToken ct) =\u003E\n        Send(new GetMeQuery(), ct);\n}\n","mutants":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Controllers/ModulesController.cs":{"language":"cs","source":"using Fugue.Api.Auth;\nusing Fugue.Api.Contracts;\nusing Fugue.Api.OpenApi;\nusing Fugue.Application.Features.Modules;\nusing Fugue.Application.Features.Modules.Commands;\nusing Fugue.Application.Features.Modules.Queries;\nusing Fugue.Domain.Identity;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace Fugue.Api.Controllers;\n\n/// \u003Csummary\u003EModule management (ADR-009): see the configuration, database and effective state, and flip the runtime switch.\u003C/summary\u003E\npublic sealed class ModulesController : ApiControllerBase\n{\n    /// \u003Csummary\u003EList modules with the configuration switch, the database switch and the resulting effective state.\u003C/summary\u003E\n    [HttpGet]\n    [HasPermission(Permissions.ModulesView)]\n    [ProducesResponseType(typeof(IReadOnlyList\u003CModuleDto\u003E), StatusCodes.Status200OK)]\n    public Task\u003CActionResult\u003CIReadOnlyList\u003CModuleDto\u003E\u003E\u003E List(CancellationToken ct) =\u003E\n        Send(new ListModulesQuery(), ct);\n\n    /// \u003Csummary\u003ESwitch a module on or off at runtime. The SYSTEM module cannot be disabled (409 \u0060module.system_protected\u0060).\u003C/summary\u003E\n    [HttpPatch(\u0022{code}\u0022)]\n    [HasPermission(Permissions.ModulesManage)]\n    [IfMatch]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022module.not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022module.system_protected\u0022)]\n    public Task\u003CIActionResult\u003E SetActive(string code, SetModuleActiveRequest body, CancellationToken ct) =\u003E\n        SendNoContent(new SetModuleActiveCommand(code, body.IsActive, IfMatchVersion), ct);\n}\n","mutants":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Controllers/OverridesController.cs":{"language":"cs","source":"using Fugue.Api.Auth;\nusing Fugue.Api.Contracts;\nusing Fugue.Api.Modules;\nusing Fugue.Api.OpenApi;\nusing Fugue.Application.Features.Overrides;\nusing Fugue.Application.Features.Overrides.Commands;\nusing Fugue.Application.Features.Overrides.Queries;\nusing Fugue.Domain.Identity;\nusing Fugue.Domain.Ids;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace Fugue.Api.Controllers;\n\n/// \u003Csummary\u003EPer-user permission overrides: an explicit allow or deny, optionally expiring. Deny wins over allow wins over role.\u003C/summary\u003E\n[Module(ModuleCodes.Identity)]\npublic sealed class OverridesController : ApiControllerBase\n{\n    /// \u003Csummary\u003EList a user\u0027s permission overrides.\u003C/summary\u003E\n    [HttpGet(\u0022{userId}\u0022)]\n    [HasPermission(Permissions.OverridesView)]\n    [ProducesResponseType(typeof(IReadOnlyList\u003COverrideDto\u003E), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022user.not_found\u0022)]\n    public Task\u003CActionResult\u003CIReadOnlyList\u003COverrideDto\u003E\u003E\u003E List(UserId userId, CancellationToken ct) =\u003E\n        Send(new ListOverridesQuery(userId), ct);\n\n    /// \u003Csummary\u003ECreate or replace an allow or deny override. Deny beats allow beats role. You cannot change your own.\u003C/summary\u003E\n    [HttpPut(\u0022{userId}/{permission}\u0022)]\n    [HasPermission(Permissions.OverridesManage)]\n    [IfMatch(Required = false)]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022user.not_found\u0022, \u0022permission.not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022override.self_target\u0022)]\n    public Task\u003CIActionResult\u003E Set(UserId userId, string permission, SetOverrideRequest body, CancellationToken ct) =\u003E\n        SendNoContent(new SetOverrideCommand(userId, permission, body.IsAllowed, body.Reason, body.ExpiresAt, IfMatchVersion), ct);\n\n    /// \u003Csummary\u003ERemove an override.\u003C/summary\u003E\n    [HttpDelete(\u0022{userId}/{permission}\u0022)]\n    [HasPermission(Permissions.OverridesManage)]\n    [IfMatch]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022override.not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022override.self_target\u0022)]\n    public Task\u003CIActionResult\u003E Remove(UserId userId, string permission, CancellationToken ct) =\u003E\n        SendNoContent(new RemoveOverrideCommand(userId, permission, IfMatchVersion), ct);\n}\n","mutants":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Controllers/WebhooksController.cs":{"language":"cs","source":"using Fugue.Api.Auth;\nusing Fugue.Api.Contracts;\nusing Fugue.Api.Idempotency;\nusing Fugue.Api.Modules;\nusing Fugue.Api.OpenApi;\nusing Fugue.Application.Features.Webhooks;\nusing Fugue.Application.Features.Webhooks.Commands;\nusing Fugue.Application.Features.Webhooks.Queries;\nusing Fugue.Domain.Identity;\nusing Fugue.Domain.Ids;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace Fugue.Api.Controllers;\n\n/// \u003Csummary\u003E\n/// Outbound webhook subscriptions (ADR-011): CRUD plus secret rotation. The secret appears only in the create and rotate responses, never again.\n/// One-liners only; every action needs \u003Cc\u003EWEBHOOKS_MANAGE\u003C/c\u003E (admin by default).\n/// \u003C/summary\u003E\n[Module(ModuleCodes.Webhooks)]\npublic sealed class WebhooksController : ApiControllerBase\n{\n    /// \u003Csummary\u003ECreate a subscription. The signing secret is in this response and never shown again. The URL must be https and public (400 \u0060webhook.url_rejected\u0060).\u003C/summary\u003E\n    [HttpPost(\u0022subscriptions\u0022)]\n    [HasPermission(Permissions.WebhooksManage)]\n    [Idempotent]\n    [ResponseCache(NoStore = true, Location = ResponseCacheLocation.None)] // the response carries the one-time secret: never cached, keyed or not\n    [ProducesResponseType(typeof(WebhookSubscriptionSecretDto), StatusCodes.Status201Created)]\n    public Task\u003CActionResult\u003CWebhookSubscriptionSecretDto\u003E\u003E Create(CreateWebhookSubscriptionRequest body, CancellationToken ct) =\u003E\n        SendCreated(new CreateWebhookSubscriptionCommand(body.Name, body.Url, body.EventTypes), nameof(Get), s =\u003E new { id = s.Id }, ct);\n\n    /// \u003Csummary\u003EGet one subscription (no secret).\u003C/summary\u003E\n    [HttpGet(\u0022subscriptions/{id}\u0022)]\n    [HasPermission(Permissions.WebhooksManage)]\n    [ProducesResponseType(typeof(WebhookSubscriptionDto), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022webhook.subscription_not_found\u0022)]\n    public Task\u003CActionResult\u003CWebhookSubscriptionDto\u003E\u003E Get(WebhookSubscriptionId id, CancellationToken ct) =\u003E\n        Send(new GetWebhookSubscriptionQuery(id), ct);\n\n    /// \u003Csummary\u003EList subscriptions, keyset paged.\u003C/summary\u003E\n    [HttpGet(\u0022subscriptions\u0022)]\n    [HasPermission(Permissions.WebhooksManage)]\n    [ProducesResponseType(typeof(IReadOnlyList\u003CWebhookSubscriptionDto\u003E), StatusCodes.Status200OK)]\n    public Task\u003CActionResult\u003CIReadOnlyList\u003CWebhookSubscriptionDto\u003E\u003E\u003E List([FromQuery] int? limit, [FromQuery] string? cursor, CancellationToken ct) =\u003E\n        SendPaged(new ListWebhookSubscriptionsQuery(limit, cursor), ct);\n\n    /// \u003Csummary\u003EReplace a subscription\u0027s name, URL, event filters and active flag.\u003C/summary\u003E\n    [HttpPut(\u0022subscriptions/{id}\u0022)]\n    [HasPermission(Permissions.WebhooksManage)]\n    [IfMatch]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022webhook.subscription_not_found\u0022)]\n    public Task\u003CIActionResult\u003E Update(WebhookSubscriptionId id, UpdateWebhookSubscriptionRequest body, CancellationToken ct) =\u003E\n        SendNoContent(new UpdateWebhookSubscriptionCommand(id, body.Name, body.Url, body.EventTypes, body.IsActive, IfMatchVersion), ct);\n\n    /// \u003Csummary\u003EIssue a new signing secret (shown once); the old one stops working immediately.\u003C/summary\u003E\n    [HttpPost(\u0022subscriptions/{id}/rotate-secret\u0022)]\n    [HasPermission(Permissions.WebhooksManage)]\n    [IfMatch]\n    [ResponseCache(NoStore = true, Location = ResponseCacheLocation.None)] // carries the one-time secret\n    [ProducesResponseType(typeof(WebhookSubscriptionSecretDto), StatusCodes.Status200OK)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022webhook.subscription_not_found\u0022)]\n    public Task\u003CActionResult\u003CWebhookSubscriptionSecretDto\u003E\u003E RotateSecret(WebhookSubscriptionId id, CancellationToken ct) =\u003E\n        Send(new RotateWebhookSecretCommand(id, IfMatchVersion), ct);\n\n    /// \u003Csummary\u003EDelete a subscription.\u003C/summary\u003E\n    [HttpDelete(\u0022subscriptions/{id}\u0022)]\n    [HasPermission(Permissions.WebhooksManage)]\n    [IfMatch]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022webhook.subscription_not_found\u0022)]\n    public Task\u003CIActionResult\u003E Delete(WebhookSubscriptionId id, CancellationToken ct) =\u003E\n        SendNoContent(new DeleteWebhookSubscriptionCommand(id, IfMatchVersion), ct);\n\n    /// \u003Csummary\u003EList deliveries (status, attempts, last result; never a body or header), newest first, keyset paged.\u003C/summary\u003E\n    [HttpGet(\u0022deliveries\u0022)]\n    [HasPermission(Permissions.WebhooksManage)]\n    [ProducesResponseType(typeof(IReadOnlyList\u003CWebhookDeliveryDto\u003E), StatusCodes.Status200OK)]\n    public Task\u003CActionResult\u003CIReadOnlyList\u003CWebhookDeliveryDto\u003E\u003E\u003E ListDeliveries([FromQuery] WebhookDeliveryListFilter filter, CancellationToken ct) =\u003E\n        SendPaged(filter.ToQuery(), ct);\n\n    /// \u003Csummary\u003ESend a dead-lettered delivery again with a fresh attempt budget.\u003C/summary\u003E\n    [HttpPost(\u0022deliveries/{id}/redeliver\u0022)]\n    [HasPermission(Permissions.WebhooksManage)]\n    [ProducesResponseType(StatusCodes.Status204NoContent)]\n    [ProblemResponse(StatusCodes.Status404NotFound, \u0022webhook.delivery_not_found\u0022)]\n    [ProblemResponse(StatusCodes.Status409Conflict, \u0022webhook.delivery_not_dead\u0022)]\n    public Task\u003CIActionResult\u003E Redeliver(WebhookDeliveryId id, CancellationToken ct) =\u003E\n        SendNoContent(new RedeliverWebhookDeliveryCommand(id), ct);\n}\n","mutants":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Correlation/CorrelationContext.cs":{"language":"cs","source":"using System.Diagnostics;\nusing Fugue.Application.Abstractions;\nusing Serilog.Context;\n\nnamespace Fugue.Api.Correlation;\n\n/// \u003Csummary\u003EScoped holder of the request\u0027s correlation and saga ids. Initialised by \u003Csee cref=\u0022CorrelationIdMiddleware\u0022/\u003E.\u003C/summary\u003E\npublic sealed class CorrelationContext : ICorrelationContext\n{\n    public string CorrelationId { get; private set; } = string.Empty;\n\n    public string? SagaId { get; private set; }\n\n    internal void Initialize(string correlationId, string? sagaId)\n    {\n        CorrelationId = correlationId;\n        SagaId = sagaId;\n    }\n\n    public void SetSaga(string sagaId)\n    {\n        if (!CorrelationIdFormat.IsValid(sagaId))\n        {\n            throw new ArgumentException(\n                $\u0022A saga id must be 1 to {CorrelationIdFormat.MaxLength} characters of [A-Za-z0-9-_].\u0022, nameof(sagaId));\n        }\n\n        SagaId = sagaId;\n st:4200\u003C/c\u003E) is always allowed in addition.\n/// \u003C/summary\u003E\npublic sealed class ApiCorsOptions\n{\n    public const string Section = \u0022Cors\u0022;\n\n    public string[] Origins { get; set; } = [];\n}\n\n/// \u003Csummary\u003EFails the host at start when an origin is not an exact origin: a typo must not silently widen or narrow the policy.\u003C/summary\u003E\npublic sealed class ApiCorsOptionsValidator : IValidateOptions\u003CApiCorsOptions\u003E\n{\n    public ValidateOptionsResult Validate(string? name, ApiCorsOptions options)\n    {\n        var failures = new List\u003Cstring\u003E();\n        foreach (string origin in options.Origins)\n        {\n            if (origin == \u0022*\u0022 || !Uri.TryCreate(origin, UriKind.Absolute, out Uri? uri)\n                || uri.Scheme is not (\u0022http\u0022 or \u0022https\u0022) || uri.PathAndQuery != \u0022/\u0022 || uri.Fragment.Length \u003E 0 || origin.EndsWith(\u0027/\u0027) || uri.UserInfo.Length \u003E 0)\n            {\n                failures.Add($\u0022Cors:Origins entry \u0027{origin}\u0027 must be an exact origin such as https://console.example.com (scheme, host, optional port; no wildcard, path or trailing slash).\u0022);\n            }\n        }\n\n        return failures.Count == 0 ? ValidateOptionsResult.Success : ValidateOptionsResult.Fail(failures);\n    }\n}\n\n/// \u003Csummary\u003E\n/// The browser policy for the Fugue Console (D-043). The console authenticates with a bearer token in the \u003Cc\u003EAuthorization\u003C/c\u003E header, never a cookie,\n/// so credentials are NOT allowed: a stolen cookie-style ambient credential is not part of this design. Only the listed origins, the methods and\n/// request headers the API uses, and the response headers a client must read (the ones that carry versions, paging, correlation and retry hints).\n/// \u003C/summary\u003E\npublic static class ConsoleCors\n{\n    public const string PolicyName = \u0022Console\u0022;\n\n    ///
