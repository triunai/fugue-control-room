22, \u0022ETag\u0022, \u0022Content-Type\u0022];\n\n    public async Task OnResourceExecutionAsync(ResourceExecutingContext context, ResourceExecutionDelegate next)\n    {\n        HttpContext http = context.HttpContext;\n        HeaderParse header = IdempotencyKeyHeader.Parse(http.Request.Headers[IdempotencyKeyHeader.Name]);\n        if (!header.IsPresent)\n        {\n            if (context.ActionDescriptor.EndpointMetadata.OfType\u003CIdempotentAttribute\u003E().Any(a =\u003E a.Required))\n            {\n                context.Result = Problem(\n                    http, StatusCodes.Status400BadRequest, \u0022idempotency.key_required\u0022,\n                    \u0022This operation requires an Idempotency-Key header, so a retry cannot create a second resource.\u0022);\n                return;\n            }\n\n            await next();\n            return;\n        }\n\n        if (!header.IsValid)\n        {\n            context.Result = Problem(\n                http, StatusCodes.Status400BadRequest, \u0022idempotency.key_invalid\u0022,\n                $\u0022The Idempotency-Key header must be one quoted string or a plain token of 1 to {IdempotencyKeyHeader.MaxLength} printable characters (letters, digits, \u0027.\u0027, \u0027_\u0027, \u0027:\u0027, \u0027-\u0027).\u0022);\n            return;\n        }\n\n        IdempotencyOptions settings = options.Value;\n        if (http.Request.ContentLength \u003E settings.MaxRequestBytes || await ReadBodyAsync(http, settings.MaxRequestBytes) is not { } body)\n        {\n            context.Result = Problem(\n                http, StatusCodes.Status413PayloadTooLarge, \u0022idempotency.body_too_large\u0022,\n                $\u0022A request with an Idempotency-Key may carry at most {settings.MaxRequestBytes} bytes.\u0022);\n            return;\n        }\n\n        Guid actor = user.UserId ?? throw new InvalidOperationException(\u0022An idempotent action ran without an authenticated user.\u0022);\n        string endpoint = $\u0022{http.Request.Method} {context.ActionDescriptor.AttributeRouteInfo?.Template?.ToLowerInvariant()}\u0022; // the template as routed (\u0022api/v1/Customers\u0022), lower-cased so the scope is stable\n        IdempotencyClaim claim = await store.ClaimAsync(actor, endpoint, header.Key!, SHA256.HashData(body), http.RequestAborted);\n\n        switch (claim.Decision)\n        {\n            case IdempotencyDecision.Execute:\n                await ExecuteAsync(context, next, claim);\n                break;\n            case IdempotencyDecision.Replay:\n                context.Result = Replay(http, claim);\n                break;\n            case IdempotencyDecision.KeyReused:\n                context.Result = Problem(http, StatusCodes.Status422UnprocessableEntity, \u0022idempotency.key_reused\u0022, \u0022This Idempotency-Key was already used with a different request body.\u0022);\n                break;\n            case IdempotencyDecision.InProgress:\n                http.Response.Headers.RetryAfter = \u00221\u0022;\n                context.Result = Problem(http, StatusCodes.Status409Conflict, \u0022idempotency.in_progress\u0022, \u0022A request with this Idempotency-Key is still being processed. Retry shortly.\u0022);\n                break;\n            case IdempotencyDecision.OutcomeUnknown:\n                context.Result = Problem(\n                    http, StatusCodes.Status409Conflict, \u0022idempotency.outcome_unknown\u0022,\n                    \u0022An earlier request with this Idempotency-Key did not finish and may or may not have taken effect. Check whether the resource exists; if it does not, retry with a new Idempotency-Key.\u0022);\n                break;\n            default:\n                context.Result = ReplayUnavailable(http);\n                break;\n        }\n    }\n\n    private async Task ExecuteAsync(ResourceExecutingContext context, ResourceExecutionDelegate next, IdempotencyClaim claim)\n    {\n        HttpContext http = context.HttpContext;\n        HttpResponse response = http.Response;\n        Stream original = response.Body;\n        using var buffer = new MemoryStream();\n        response.Body = buffer;\n        ResourceExecutedContext executed;\n        try\n        {\n            executed = await next();\n            await response.BodyWriter.FlushAsync(CancellationToken.None);\n        }\n        finally\n        {\n            response.Body = original;\n        }\n\n        if (executed.Exception is not null || http.RequestAborted.IsCancellationRequested)\n        {\n            return; // outcome unknown: the key stays pending, the exception goes on to the exception handler\n        }\n\n        int status = response.StatusCode;\n        if (status is \u003E= 200 and \u003C 300)\n        {\n            response.Headers.CacheControl = \u0022no-store\u0022;\n            await TryCompleteAsync(http, claim, status, buffer);\n        }\n        else if (executed.Result is ProblemResult \u0026\u0026 status is \u003E= 400 and \u003C 500)\n        {\n            await TryReleaseAsync(http, claim);\n        }\n\n        buffer.Position = 0;\n        await buffer.CopyToAsync(original, http.RequestAborted);\n    }\n\n    private async Task TryCompleteAsync(HttpContext http, IdempotencyClaim claim, int status, MemoryStream buffer)\n    {\n        try\n        {\n            if (buffer.Length \u003E options.Value.MaxResponseBytes || SafeHeaders(http.Response) is not { } headers)\n            {\n                LogNotStored(logger, claim.RecordId);\n                return;\n            }\n\n            if (!await store.CompleteAsync(claim.RecordId, claim.ClaimToken, status, JsonSerializer.Serialize(headers), buffer.ToArray(), http.RequestAborted))\n            {\n                LogClaimLost(logger, claim.RecordId);\n            }\n        }\n        catch (Exception ex) when (ex is not OperationCanceledException)\n        {\n            LogStoreFailed(logger, ex, claim.RecordId);\n        }\n    }\n\n    private async Task TryReleaseAsync(HttpContext http, IdempotencyClaim claim)\n    {\n        try\n        {\n            await store.ReleaseAsync(claim.RecordId, claim.ClaimToken, http.RequestAborted);\n        }\n        catch (Exception ex) when (ex is not OperationCanceledException)\n        {\n            LogStoreFailed(logger, ex, claim.RecordId);\n        }\n    }\n\n    /// \u003Csummary\u003EThe allowlisted headers of the response, or null when one holds a control character (it would be replayed to a client verbatim).\u003C/summary\u003E\n    private static Dictionary\u003Cstring, string\u003E? SafeHeaders(HttpResponse response)\n    {\n        var headers = new Dictionary\u003Cstring, string\u003E(StringComparer.OrdinalIgnoreCase);\n        foreach (string name in StoredHeaders)\n        {\n            string value = name == \u0022Content-Type\u0022 ? response.ContentType ?? string.Empty : response.Headers[name].ToString();\n            if (value.Length == 0)\n            {\n                continue;\n            }\n\n            if (!IsSafeHeaderValue(value))\n            {\n                return null;\n            }\n\n            headers[name] = value;\n        }\n\n        return headers;\n    }\n\n    private static bool IsSafeHeaderValue(string value) =\u003E\n        value.Length \u003C= MaxHeaderValueLength \u0026\u0026 value.All(c =\u003E c is \u003E= \u0027 \u0027 and not \u0027\\u007f\u0027);\n\n    private IActionResult Replay(HttpContext http, IdempotencyClaim claim)\n    {\n        Dictionary\u003Cstring, string\u003E? stored;\n        try\n        {\n            stored = claim.ResponseHeaders is null ? [] : JsonSerializer.Deserialize\u003CDictionary\u003Cstring, string\u003E\u003E(claim.ResponseHeaders);\n        }\n        catch (JsonException)\n        {\n            stored = null;\n        }\n\n        if (stored is null || claim.ResponseBody is null || stored.Any(h =\u003E !StoredHeaders.Contains(h.Key, StringCompare {\n            return Nullable.GetUnderlyingType(property.PropertyType) is null;\n        }\n\n        lock (Nullability)\n        {\n            return Nullability.Create(property).ReadState == NullabilityState.NotNull;\n        }\n    }\n\n    private static void AddProblemExtensions(OpenApiSchema schema)\n    {\n        schema.Properties[\u0022code\u0022] = new OpenApiSchema { Type = \u0022string\u0022, Description = \u0022Stable machine-readable error code, such as customer.not_found. Clients branch on this, never on the title.\u0022 };\n        schema.Properties[\u0022traceId\u0022] = new OpenApiSchema { Type = \u0022string\u0022, Description = \u0022W3C trace id of the request, for finding it in the logs.\u0022 };\n        schema.Properties[\u0022correlationId\u0022] = new OpenApiSchema { Type = \u0022string\u0022, Description = \u0022The request\u0027s X-Correlation-Id (echoed, or generated when the client sent none).\u0022 };\n        schema.Properties[\u0022tenantId\u0022] = new OpenApiSchema { Type = \u0022string\u0022, Format = \u0022uuid\u0022, Nullable = true, Description = \u0022The caller\u0027s tenant, present only when tenancy is on and the caller is authenticated.\u0022 };\n        schema.AdditionalPropertiesAllowed = true;\n    }\n}\n","mutants":[{"id":"1290","mutatorName":"Block removal mutation","replacement":"{}","location":{"start":{"line":19,"column":5},"end":{"line":40,"column":6}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"1291","mutatorName":"Logical mutation","replacement":"type == typeof(ProblemDetails) \u0026\u0026 type == typeof(ValidationProblemDetails)","location":{"start":{"line":21,"column":13},"end":{"line":21,"column":87}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"1292","mutatorName":"Negate expression","replacement":"!(type == typeof(ProblemDetails) || type == typeof(ValidationProblemDetail .Authorization;\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.AspNetCore.Mvc.Infrastructure;\nusing Microsoft.Extensions.Options;\nusing Serilog;\n\n// Bootstrap logger: covers startup failures before the configured logger exists.\nLog.Logger = new LoggerConfiguration().WriteTo.Console(formatProvider: System.Globalization.CultureInfo.InvariantCulture).CreateLogger();\n\ntry\n{\n    WebApplicationBuilder builder = WebApplication.CreateBuilder(args);\n\n    builder.Host.UseFugueSerilog();\n\n    builder.Services.AddRouting(options =\u003E options.LowercaseUrls = true);\n    builder.Services.AddControllers()\n        .ConfigureApiBehaviorOptions(options =\u003E\n            // Framework-generated 400s (model binding, invalid model state) go through the same ProblemResult\n            // and enrichment as handler failures: application/problem\u002Bjson with code, traceId, correlationId.\n            options.InvalidModelStateResponseFactory = context =\u003E\n            {\n                var factory = context.HttpContext.RequestServices.GetRequiredService\u003CProblemDetailsFactory\u003E();\n                ValidationProblemDetails problem = factory.CreateValidationProblemDetails(\n                    context.HttpContext, context.ModelState, StatusCodes.Status400BadRequest);\n                problem.Extensions[\u0022code\u0022] = \u0022validation.failed\u0022;\n                ProblemDetailsEnrichment.AddCorrelation(problem, context.HttpContext);\n                return new ProblemResult(problem);\n            });\n    builder.Services.AddProblemDetails(options =\u003E\n        options.CustomizeProblemDetails = context =\u003E\n            ProblemDetailsEnrichment.AddCorrelation(context.ProblemDetails, context.HttpContext));\n    builder.Services.AddExceptionHandler\u003CGlobalExceptionHandler\u003E();\n    builder.Services.AddFugueOpenApi();\n    builder.Services.AddConsoleCors(builder.Configuration, builder.Environment);\n    builder.Services.AddHttpContextAccessor();\n    builder.Services.AddScoped\u003CICurrentUser, JwtCurrentUser\u003E();\n\n    // Authentication (JWT HS256) and authorization (effective permissions). The fallback policy makes every endpoint\n    // require an authenticated caller; anonymous endpoints are explicit [AllowAnonymous] exceptions.\n    builder.Services.AddOptions\u003CAuthOptions\u003E().Bind(builder.Configuration.GetSection(AuthOptions.Section)).ValidateOnStart();\n    builder.Services.AddSingleton\u003CIValidateOptions\u003CAuthOptions\u003E, AuthOptionsValidator\u003E();\n    builder.Services.AddSingleton\u003CIAccessTokenIssuer, JwtAccessTokenIssuer\u003E();\n    builder.Services.AddSingleton\u003CIConfigureOptions\u003CJwtBearerOptions\u003E, JwtBearerSetup\u003E();\n    builder.Services.AddSingleton\u003CUnauthenticatedAuditLimiter\u003E();\n    builder.Services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme).AddJwtBearer();\n    builder.Services.AddAuthorizationBuilder().SetFallbackPolicy(new AuthorizationPolicyBuilder().RequireAuthenticatedUser().Build());\n    builder.Services.AddSingleton\u003CIAuthorizationPolicyProvider, PermissionPolicyProvider\u003E();\n    builder.Services.AddSingleton\u003CIAuthorizationHandler, PermissionHandler\u003E();\n    builder.Services.AddAuthRateLimiting(builder.Configuration);\n    builder.Services.AddScoped\u003CCorrelationContext\u003E();\n    builder.Services.AddScoped\u003CICorrelationContext\u003E(sp =\u003E sp.GetRequiredService\u003CCorrelationContext\u003E());\n    builder.Services.AddOptions\u003CAuditOptions\u003E().Bind(builder.Configuration.GetSection(AuditOptions.Section)).ValidateOnStart();\n    builder.Services.AddSingleton\u003CIValidateOptions\u003CAuditOptions\u003E, AuditOptionsValidator\u003E();\n    builder.Services.AddScoped\u003CIAuditRequestInfo, HttpAuditRequestInfo\u003E(); // before AddInfrastructure, which only adds a null default\n    builder.Services.AddApplication();\n    builder.Services.AddInfrastructure(builder.Configuration);\n\n    // Development-only seeding: opt in with \u0060dotnet run -- --seed\u0060 (or Seed:Enabled=true). Never in tests or other environments.\n    if (builder.Environment.IsDevelopment() \u0026\u0026 (args.Contains(\u0022--seed\u0022) || builder.Configuration.GetValue\u003Cbool\u003E(\u0022Seed:Enabled\u0022)))\n    {\n        builder.Services.AddHostedService\u003CDevelopmentSeedHostedService\u003E();\n    }\n    builder.Services.AddMediator(options =\u003E\n    {\n        options.ServiceLifetime = ServiceLifetime.Scoped;\n\n        // Outermost first: logging sees everything; audit wraps validation so validation failures get a failure row (ADR-010).\n        options.PipelineBehaviors = [typeof(LoggingBehavior\u003C,\u003E), typeof(AuditBehavior\u003C,\u003E), typeof(ValidationBehavior\u003C,\u003E)];\n    });\n\n    WebApplication app = builder.Build();\n\n    app.UseMiddleware\u003CCorrelationIdMiddleware\u003E();\n    app.UseFugueRequestLogging();\n    app.UseExceptionHandler();\n    app.UseCors(ConsoleCors.PolicyName); // before authentication: a preflight carries no token and must be answered here\n    app.UseFugueOpenApi(); // Development only\n    app.UseStatusCodePages(); // empty 404/405/415 etc. become problem\u002Bjson via AddProblemDetails\n    app.UseAuthentication();\n    app.UseMiddleware\u003CFugue.Api.Modules.ModuleGateMiddleware\u003E();\n    app.UseRateLimiter();\n    app.UseAuthorization();\n    app.MapControllers();\n\n    app.Run();\n}\ncatch (Exception ex) when (ex is not HostAbortedException)\n{\n    Log.Fatal(ex, \u0022Host terminated unexpectedly\u0022);\n    throw;\n}\nfinally\n{\n    Log.CloseAndFlush();\n}\n\n/// \u003Csummary\u003EExposes the entry point to \u003Cc\u003EWebApplicationFactory\u0026lt;Program\u0026gt;\u003C/c\u003E.\u003C/summary\u003E\npublic partial class Program;\n","mutants":[{"id":"1395","mutatorName":"Block removal mutation","replacement":"{}","location":{"start":{"line":26,"column":1},"end":{" ,"location":{"start":{"line":105,"column":5},"end":{"line":105,"column":51}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"1451","mutatorName":"String mutation","replacement":"\u0022\u0022","location":{"start":{"line":105,"column":19},"end":{"line":105,"column":49}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"1452","mutatorName":"Statement mutation","replacement":";","location":{"start":{"line":106,"column":5},"end":{"line":106,"column":11}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"1453","mutatorName":"Block removal mutation","replacement":"{}","location":{"start":{"line":109,"column":1},"end":{"line":111,"column":2}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"1454","mutatorName":"Statement mutation","replacement":";","location":{"start":{"line":110,"column":5},"end":{"line":110,"column":25}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]}]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api/Seeding/DevelopmentSeedHostedService.cs":{"language":"cs","source":"using Fugue.Infrastructure.Identity;\nusing Fugue.Infrastructure.Persistence.Seeding;\n\nnamespace Fugue.Api.Seeding;\n\n/// \u003Csummary\u003E\n/// Runs the idempotent customer, user and claim seeders once at startup. A hosted service (not a seed-and-exit flag) so\n/// \u003Cc\u003Edotnet run -- --seed\u003C/c\u003E leaves a running, populated API. Registered only in Development.\n/// The database must already be migrated; a failure is logged and stops startup rather than serving a half-seeded API.\n/// \u003C/summary\u003E\ninternal sealed partial class DevelopmentSeedHostedService(IServiceScopeFactory scopes, IConfiguration configuration, ILogger\u003CDevelopmentSeedHostedService\u003E logger)\n    : IHostedService\n{\n    public async Task StartAsync(CancellationToken cancellationToken)\n    {\n        await using AsyncServiceScope scope = scopes.CreateAsyncScope();\n        int count = await scope.ServiceProvider.GetRequiredService\u003CICustomerSeeder\u003E().SeedAsync(cancellationToken);\n        LogSeeded(count);\n\n        // Development-only password (documented in docs/runbooks/05-auth.md). Override with Seed:DevPassword.\n        string password = configuration[\u0022Seed:DevPassword\u0022] ?? \u0022Fugue-Dev-Passw0rd!\u0022; // secrets-scan:ignore\n        await scope.ServiceProvider.GetRequiredService\u003CIIdentitySeeder\u003E().SeedDevelopmentUsersAsync(password, cancellationToken);\n        LogUsers();\n\n        // The claims seed needs the dev users (claimants and officers), so it runs after them.\n        LogClaims(await scope.ServiceProvider.GetRequiredService\u003CIClaimSeeder\u003E().SeedAsync(cancellationToken));\n    }\n\n    [LoggerMessage(Level = LogLevel.Information, Message = \u0022Seeded {Count} development customers\u0022)]\n    private partial void LogSeeded(int count);\n\n    [LoggerMessage(Level = LogLevel.Information, Message = \u0022Seeded development users (admin, staff, manager, support, self, self2)\u0022)]\n    private partial void LogUsers();\n\n    [LoggerMessage(Level = LogLevel.Information, Message = \u0022Seeded {Count} development claims\u0022)]\n    private partial void LogClaims(int count);\n\n    public Task StopAsync(CancellationToken cancellationToken) =\u003E Task.CompletedTask;\n}\n","mutants":[{"id":"1455","mutatorName":"Block removal mutation","replacement":"{}","location":{"start":{"line":15,"column":5},"end":{"line":27,"column":6}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"1456","mutatorName":"Statement mutation","replacement":";","location":{"start":{"line":18,"column":9},"end":{"line":18,"column":26}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"1457","mutatorName":"Null coalescing mutation (remove left)","replacement":"\u0022Fugue-Dev-Passw0rd!\u0022","location":{"start":{"line":21,"column":27},"end":{"line":21,"column":85}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"1458","mutatorName":"String mutation","replacement":"\u0022\u0022","location":{"start":{"line":21,"column":41},"end":{"line":21,"column":59}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"1459","mutatorName":"String mutation","replacement":"\u0022\u0022","location":{"start":{"line":21,"column":64},"end":{"line":21,"column":85}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"1460","mutatorName":"Statement mutation","replacement":";","location":{"start":{"line":22,"column":9},"end":{"line":22,"column":130}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"1461","mutatorName":"Statement mutation","replacement":";","location":{"start":{"line":23,"column":9},"end":{"line":23,"column":20}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]},{"id":"1462","mutatorName":"Statement mutation","replacement":";","location":{"start":{"line":26,"column":9},"end":{"line":26,"column":112}},"status":"Ignored","statusReason":"Removed by mutate filter","static":false,"coveredBy":[],"killedBy":[]}]}},"projectRoot":"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/src/Fugue.Api","schemaVersion":"2","testFiles":{"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/tests/Fugue.MutationTests/../Fugue.Tests/Domain/ClaimTests.cs":{"language":"cs","source":"using FluentResults;\nusing Fugue.Domain.Claims;\nusing Fugue.Domain.Events;\nusing Fugue.Domain.Ids;\nusing Fugue.Domain.Results;\n\nnamespace Fugue.Tests.Domain;\n\n/// \u003Csummary\u003EThe Claim state machine (decision C of the claims window): every legal move, every illegal move, and the money rules.\u003C/summary\u003E\npublic sealed class ClaimTests\n{\n    private static readonly DateTimeOffset T0 = new(2030, 1, 2, 3, 4, 5, TimeSpan.Zero);\n    private static readonly UserId Claimant = UserId.New();\n    private static readonly UserId Officer = UserId.New();\n\n    private static Claim NewClaim(Market market = Market.SG) =\u003E Claim.Submit(\n        ClaimNumber.Format(market, 2030, 1), market, LineOfBusiness.Motor, Claimant, \u0022Ada Claimant\u0022, \u0022 POL-1 \u0022, new DateOnly(2030, 1, 1),\n        \u0022  Rear-ended at the lights. \u0022, \u0022  Orchard Rd \u0022, T0);\n\n    /// \u003Csummary\u003EA claim brought to \u003Cparamref name=\u0022status\u0022/\u003E by legal moves; the open states carry a reserve of 1000 so approving is possible.\u003C/summary\u003E\n    private static Claim At(ClaimStatus status)\n    {\n        Claim claim = NewClaim();\n        if (status == ClaimStatus.Submitted)\n        {\n            return claim;\n        }\n\n        Assert.True(claim.Pickup(Officer, \u0022Officer\u0022, T0).IsSuccess);\n        if (status == ClaimStatus.InfoRequested)\n        {\n            Assert.True(claim.RequestInfo(\u0022Photos of the damage?\u0022, Officer, \u0022Officer\u0022, T0).IsSuccess);\n            Assert.True(claim.SetReserve(1000).IsSuccess);\n            return claim;\n        }\n\n        Assert.True(claim.SetReserve(1000).IsSuccess);\n        switch (status)\n        {\n            case ClaimStatus.Approved:\n            case ClaimStatus.Settled:\n                Assert.True(claim.Approve(800, \u0022Covered.\u0022, Officer, \u0022Officer\u0022, T0).IsSuccess);\n                if (status == ClaimStatus.Settled)\n                {\n                    Assert.True(claim.Settle(Officer, \u0022Officer\u0022, T0).IsSuccess);\n                }\n\n                break;\n            case ClaimStatus.Rejected:\n                Assert.True(claim.Reject(\u0022Not covered.\u0022, Officer, \u0022Officer\u0022, T0).IsSuccess);\n                break;\n        }\n\n        return claim;\n    }\n\n    public enum Move\n    {\n        Pickup,\n        RequestInfo,\n        ProvideInfo,\n        SetReserve,\n        Approve,\n        Reject,\n        Settle,\n    }\n\n    private static Result Apply(Claim claim, Move move) =\u003E move switch\n    {\n        Move.Pickup =\u003E claim.Pickup(Officer, \u0022Officer\u0022, T0.AddHours(1)),\n        Move.RequestInfo =\u003E claim.RequestInfo(\u0022Anything else?\u0022, Officer, \u0022Officer\u0022, T0.AddHours(1)),\n        Move.ProvideInfo =\u003E claim.ProvideInfo(claim.OpenInfoRequest?.Id ?? ClaimInfoRequestId.New(), \u0022Here you go\u0022, Claimant, \u0022Ada Claimant\u0022, T0.AddHours(1)),\n        Move.SetReserve =\u003E claim.SetReserve(2000),\n        Move.Approve =\u003E claim.Approve(500, \u0022Covered.\u0022, Officer, \u0022Officer\u0022, T0.AddHours(1)),\n        Move.Reject =\u003E claim.Reject(\u0022Not covered.\u0022, Officer, \u0022Officer\u0022, T0.AddHours(1)),\n        Move.Settle =\u003E claim.Settle(Officer, \u0022Officer\u0022, T0.AddHours(1)),\n        _ =\u003E throw new ArgumentOutOfRangeException(nameof(move)),\n    };\n\n    /// \u003Csummary\u003EThe whole machine: from each status, the one-or-two moves that are legal and where they lead (null target = status unchanged).\u003C/summary\u003E\n    private static readonly Dictionary\u003C(ClaimStatus From, Move Move), ClaimStatus?\u003E Legal = new()\n    {\n        [(ClaimStatus.Submitted, Move.Pickup)] = ClaimStatus.UnderReview,\n        [(ClaimStatus.UnderReview, Move.RequestInfo)] = ClaimStatus.InfoRequested,\n        [(ClaimStatus.UnderReview, Move.SetReserve)] = null,\n        [(ClaimStatus.UnderReview, Move.Approve)] = ClaimStatus.Approved,\n        [(ClaimStatus.UnderReview, Move.Reject)] = ClaimStatus.Rejected,\n        [(ClaimStatus.InfoRequested, Move.ProvideInfo)] = ClaimStatus.UnderReview,\n        [(ClaimStatus.InfoRequested, Move.SetReserve)] = null,\n        [(ClaimStatus.Approved, Move.Settle)] = ClaimStatus.Settled,\n    };\n\n    public static TheoryData\u003CClaimStatus, Move\u003E Table()\n    {\n        var data = new TheoryData\u003CClaimStatus, Move\u003E();\n        foreach (ClaimStatus status in Enum.GetValues\u003CClaimStatus\u003E())\n        {\n            foreach (Move move in Enum.GetValues\u003CMove\u003E())\n            {\n                data.Add(status, move);\n            }\n        }\n\n        return data;\n    }\n\n    [Theory]\n    [MemberData(nameof(Table))]\n    public void The_transition_table_holds_for_every_status_and_move(ClaimStatus from, Move move)\n    {\n        Claim claim = At(from);\n        int timeline = claim.Timeline.Count;\n        int events = ((IHasDomainEvents)claim).DomainEvents.Count;\n\n        Result result = Apply(claim, move);\n\n        if (Legal.TryGetValue((from, move), out ClaimStatus? target))\n        {\n            Assert.True(result.IsSuccess, $\u0022{move} from {from} should be legal\u0022);\n            Assert.Equal(target ?? from, claim.Status);\n            // A status change writes exactly one timeline row and one event; the reserve is internal and writes neither.\n            int expected = target is null ? 0 : 1;\n            Assert.Equal(timeline \u002B expected, claim.Timeline.Count);\n            Assert.Equal(events \u002B expected, ((IHasDomainEvents)claim).DomainEvents.Count);\n            if (target is not null)\n            {\n                ClaimTimelineEntry last = claim.Timeline.Last();\n                Assert.Equal(from, last.FromStatus);\n                Assert.Equal(target, last.ToStatus);\n            }\n        }\n        else\n        {\n            Assert.True(result.IsFailed, $\u0022{move} from {from} should be illegal\u0022);\n            FugueError error = Assert.IsType\u003CFugueError\u003E(result.Errors[0]);\n            Assert.Equal(ErrorType.Conflict, error.Type);\n            Assert.Equal(\u0022claim.invalid_transition\u0022, error.Code);\n            Assert.Contains(from.ToString(), error.Message, StringComparison.Ordinal);\n            Assert.Equal(from, claim.Status);\n            Assert.Equal(timeline, claim.Timeline.Count);\n            Assert.Equal(events, ((IHasDomainEvents)claim).DomainEvents.Count);\n        }\n    }\n\n    [Fact]\n    public void An_illegal_move_message_names_the_states_and_carries_no_user_data()\n    {\n        Claim claim = At(ClaimStatus.Rejected);\n\n        FugueError error = Assert.IsType\u003CFugueError\u003E(claim.Approve(1, \u0022reason-with-secret\u0022, Officer, \u0022Officer\u0022, T0).Errors[0]);\n\n        Assert.Equal(\u0022A claim cannot move from Rejected to Approved.\u0022, error.Message);\n        Assert.DoesNotContain(\u0022secret\u0022, error.Message, StringComparison.Ordinal);\n        Assert.DoesNotContain(claim.PolicyNumber, error.Message, StringComparison.Ordinal);\n    }\n\n    [Theory]\n    [InlineData(ClaimStatus.Rejected)]\n    [InlineData(ClaimStatus.Settled)]\n    public void Terminal_states_accept_no_move_at_all(ClaimStatus terminal)\n    {\n        foreach (Move move in Enum.GetValues\u003CMove\u003E())\n        {\n            Claim claim = At(terminal);\n            Assert.True(Apply(claim, move).IsFailed, $\u0022{move} must fail from {terminal}\u0022);\n            Assert.Equal(terminal, claim.Status);\n        }\n    }\n\n    [Fact]\n    public void Submit_normalises_input_fixes_the_currency_by_market_and_records_the_first_timeline_row()\n    {\n        Claim claim = NewClaim(Market.ID);\n\n        Assert.Equal(ClaimStatus.Submitted, claim.Status);\n        Assert.Equal(\u0022IDR\u0022, claim.Currency);\n        Assert.Equal(\u0022POL-1\u0022, claim.PolicyNumber);\n        Assert.Equal(\u0022Rear-ended at the lights.\u0022, claim.IncidentDescription);\n        Assert.Equal(\u0022Orchard Rd\u0022, claim.IncidentLocation);\n        Assert.Equal(T0, claim.SubmittedAt);\n        Assert.Null(claim.ReserveMinor);\n        ClaimTimelineEntry first = Assert.Single(claim.Timeline);\n        Assert.Null(first.FromStatus);\n        Assert.Equal(ClaimStatus.Submitted, first.ToStatus);\n        Assert.Equal(Claimant, first.ActorUserId);\n        IDomainEvent evt = Assert.Single(((IHasDomainEvents)claim).DomainEvents);\n        Assert.Equal(\u0022claim.submitted.v1\u0022, evt.EventType);\n    }\n\n    [Theory]\n    [InlineData(Market.SG, \u0022SGD\u0022)]\n    [InlineData(Market.MY, \u0022MYR\u0022)]\n    [InlineData(Market.TH, \u0022THB\u0022)]\n    [InlineData(Market.HK, \u0022HKD\u0022)]\n    [InlineData(Market.ID, \u0022IDR\u0022)]\n    [InlineData(Market.PH, \u0022PHP\u0022)]\n    public void Each_market_has_exactly_its_own_currency(Market market, string currency) =\u003E\n        Assert.Equal(currency, NewClaim(market).Currency);\n\n    [Fact]\n    public void Claim_numbers_carry_market_year_and_a_padded_sequence() =\u003E\n        Assert.Equal(\u0022CLM-TH-2030-000042\u0022, ClaimNumber.Format(Market.TH, 2030, 42));\n\n    [Fact]\n    public void Pickup_assigns_the_officer_and_the_event_has_a_thin_payload()\n    {\n        Claim claim = NewClaim();\n\n        claim.Pickup(Officer, \u0022Officer\u0022, T0.AddMinutes(5));\n\n        Assert.Equal(Officer, claim.AssignedOfficerId);\n        Assert.Equal(T0.AddMinutes(5), claim.AssignedAt);\n        Assert.Equal([\u0022claim.submitted.v1\u0022, \u0022claim.assigned.v1\u0022], ((IHasDomainEvents)claim).DomainEvents.Select(e =\u003E e.EventType));\n    }\n\n    [Fact]\n    public void Requesting_info_opens_exactly_one_question_and_a_second_request_is_refused()\n    {\n        Claim claim = At(ClaimStatus.UnderReview);\n\n        Assert.True(claim.RequestInfo(\u0022  Photos?  \u0022, Officer, \u0022Officer\u0022, T0).IsSuccess);\n\n        ClaimInfoRequest open = Assert.Single(claim.InfoRequests);\n        Assert.True(open.IsOpen);\n        Assert.Equal(\u0022Photos?\u0022, open.Question);\n        Assert.Equal(open.Id, claim.OpenInfoRequest!.Id);\n        Assert.True(claim.RequestInfo(\u0022Another?\u0022, Officer, \u0022Officer\u0022, T0).IsFailed);\n        Assert.Single(claim.InfoRequests);\n    }\n\n    [Fact]\n    public void Answering_closes_the_request_and_returns_the_claim_to_review()\n    {\n        Claim claim = At(ClaimStatus.InfoRequested);\n        ClaimInfoRequestId id = claim.OpenInfoRequest!.Id;\n\n        Result result = claim.ProvideInfo(id, \u0022  Attached.  \u0022, Claimant, \u0022Ada Claimant\u0022, T0.AddHours(2));\n\n        Assert.True(result.IsSuccess);\n        Assert.Equal(ClaimStatus.UnderReview, claim.Status);\n        Assert.Null(claim.OpenInfoRequest);\n        ClaimInfoRequest answered = Assert.Single(claim.InfoRequests);\n        Assert.Equal(\u0022Attached.\u0022, answered.Response);\n        Assert.Equal(T0.AddHours(2), answered.RespondedAt);\n    }\n\n    [Fact]\n    public void Answering_with_an_id_that_is_not_the_open_request_is_a_404_and_changes_nothing()\n    {\n        Claim claim = At(ClaimStatus.InfoRequested);\n\n        Result result = claim.ProvideInfo(ClaimInfoRequestId.New(), \u0022x\u0022, Claimant, \u0022Ada Claimant\u0022, T0);\n\n        FugueError error = Assert.IsType\u003CFugueError\u003E(result.Errors[0]);\n        Assert.Equal(ErrorType.NotFound, error.Type);\n        Assert.Equal(\u0022claim.info_request_not_found\u0022, error.Code);\n        Assert.Equal(ClaimStatus.InfoRequested, claim.Status);\n        Assert.NotNull(claim.OpenInfoRequest);\n    }\n\n    [Theory]\n    [InlineData(0L)]\n    [InlineData(-5L)]\n    public void A_reserve_must_be_positive(long amount)\n    {\n        Claim claim = At(ClaimStatus.UnderReview);\n\n        FugueError error = Assert.IsType\u003CFugueError\u003E(claim.SetReserve(amount).Errors[0]);\n\n        Assert.Equal(ErrorType.Validation, error.Type);\n        Assert.Equal(\u0022claim.amount_invalid\u0022, error.Code);\n        Assert.Equal(1000, claim.ReserveMinor); // the earlier reserve stands\n    }\n\n    [Fact]\n    public void The_reserve_can_be_revised_while_the_claim_is_open()\n    {\n        Claim claim = At(ClaimStatus.UnderReview);\n\n        Assert.True(claim.SetReserve(2500).IsSuccess);\n\n        Assert.Equal(2500, claim.ReserveMinor);\n    }\n\n    [Fact]\n    public void Approving_without_a_reserve_is_a_409_reserve_required()\n    {\n        Claim claim = NewClaim();\n        claim.Pickup(Officer, \u0022Officer\u0022, T0);\n\n        FugueError error = Assert.IsType\u003CFugueError\u003E(claim.Approve(100, \u0022ok\u0022, Officer, \u0022Officer\u0022, T0).Errors[0]);\n\n        Assert.Equal(ErrorType.Conflict, error.Type);\n        Assert.Equal(\u0022claim.reserve_required\u0022, error.Code);\n        Assert.Equal(ClaimStatus.UnderReview, claim.Status);\n    }\n\n    [Theory]\n    [InlineData(0L)]\n    [InlineData(-1L)]\n    [InlineData(1001L)] // the reserve is 1000\n    public void An_approved_amount_outside_zero_to_reserve_is_a_400_and_changes_nothing(long amount)\n    {\n        Claim claim = At(ClaimStatus.UnderReview);\n\n        FugueError error = Assert.IsType\u003CFugueError\u003E(claim.Approve(amount, \u0022ok\u0022, Officer, \u0022Officer\u0022, T0).Errors[0]);\n\n        Assert.Equal(ErrorType.Validation, error.Type);\n        Assert.Equal(\u0022claim.amount_invalid\u0022, error.Code);\n        Assert.Equal(ClaimStatus.UnderReview, claim.Status);\n        Assert.Null(claim.ApprovedAmountMinor);\n    }\n\n    [Theory]\n    [InlineData(1L)]\n    [InlineData(1000L)] // exactly the reserve\n    public void An_approved_amount_up_to_and_including_the_reserve_is_accepted(long amount)\n    {\n        Claim claim = At(ClaimStatus.UnderReview);\n\n        Assert.True(claim.Approve(amount, \u0022  Covered. \u0022, Officer, \u0022Officer\u0022, T0.AddDays(1)).IsSuccess);\n\n        Assert.Equal(ClaimStatus.Approved, claim.Status);\n        Assert.Equal(amount, claim.ApprovedAmountMinor);\n        Assert.Equal(\u0022Covered.\u0022, claim.DecisionReason);\n        Assert.Equal(T0.AddDays(1), claim.DecidedAt);\n    }\n\n    [Fact]\n    public void Rejecting_needs_no_reserve_and_records_the_reason()\n    {\n        Claim claim = NewClaim();\n        claim.Pickup(Officer, \u0022Officer\u0022, T0);\n\n        Assert.True(claim.Reject(\u0022Policy lapsed.\u0022, Officer, \u0022Officer\u0022, T0.AddDays(1)).IsSuccess);\n\n        Assert.Equal(ClaimStatus.Rejected, claim.Status);\n        Assert.Null(claim.ApprovedAmountMinor);\n        Assert.Equal(\u0022Policy lapsed.\u0022, claim.DecisionReason);\n        Assert.Equal(\u0022claim.decided.v1\u0022, ((IHasDomainEvents)claim).DomainEvents.Last().EventType);\n    }\n\n    [Fact]\n    public void Settling_stamps_the_time_and_emits_the_settled_event()\n    {\n        Claim claim = At(ClaimStatus.Approved);\n\n        Assert.True(claim.Settle(Officer, \u0022Officer\u0022, T0.AddDays(3)).IsSuccess);\n\n        Assert.Equal(T0.AddDays(3), claim.SettledAt);\n        Assert.Equal(\u0022claim.settled.v1\u0022, ((IHasDomainEvents)claim).DomainEvents.Last().EventType);\n    }\n\n    [Fact]\n    public void The_timeline_never_carries_the_reserve_or_the_approved_amount()\n    {\n        Claim claim = At(ClaimStatus.Settled);\n\n        Assert.All(claim.Timeline, e =\u003E\n        {\n            Assert.DoesNotContain(\u00221000\u0022, e.Note, StringComparison.Ordinal);\n            Assert.DoesNotContain(\u0022800\u0022, e.Note, StringComparison.Ordinal);\n        });\n    }\n\n    [Fact]\n    public void Event_payloads_are_thin_and_never_name_money_or_free_text()\n    {\n        Claim claim = At(ClaimStatus.Settled);\n\n        string[] banned = [\u0022Reserve\u0022, \u0022Amount\u0022, \u0022Description\u0022, \u0022Reason\u0022, \u0022Question\u0022, \u0022Answer\u0022, \u0022Policy\u0022];\n        Assert.All(((IHasDomainEvents)claim).DomainEvents, e =\u003E\n            Assert.DoesNotContain(e.GetType().GetProperties(), p =\u003E banned.Any(b =\u003E p.Name.Contains(b, StringComparison.Ordinal))));\n    }\n\n    [Theory]\n    [InlineData(Market.SG, 8)]\n    [InlineData(Market.HK, 8)]\n    [InlineData(Market.MY, 8)]\n    [InlineData(Market.PH, 8)]\n    [InlineData(Market.TH, 7)]\n    [InlineData(Market.ID, 7)]\n    public void Local_today_uses_the_markets_fixed_offset(Market market, int offset)\n    {\n        var lateUtc = new DateTimeOffset(2030, 3, 10, 16, 30, 0, TimeSpan.Zero);\n\n        DateOnly today = Markets.LocalToday(market, lateUtc);\n\n        Assert.Equal(DateOnly.FromDateTime(lateUtc.UtcDateTime.AddHours(offset)), today);\n        Assert.Equal(offset == 8 ? new DateOnly(2030, 3, 11) : new DateOnly(2030, 3, 10), today);\n    }\n}\n","tests":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/tests/Fugue.MutationTests/../Fugue.Tests/Domain/ClaimNarrativeTests.cs":{"language":"cs","source":"using FluentResults;\nusing Fugue.Domain.Claims;\nusing Fugue.Domain.Ids;\nusing Fugue.Domain.Results;\n\nnamespace Fugue.Tests.Domain;\n\n/// \u003Csummary\u003E\n/// What the claimant reads (timeline notes) and what the API shows on a refusal (error messages and field names). Found by mutation testing\n/// (docs/quality/mutation): the state machine was well covered, the words it writes were not.\n/// \u003C/summary\u003E\npublic sealed class ClaimNarrativeTests\n{\n    private static readonly DateTimeOffset T0 = new(2030, 1, 2, 3, 4, 5, TimeSpan.Zero);\n    private static readonly UserId Claimant = UserId.New();\n    private static readonly UserId Officer = UserId.New();\n\n    private static Claim Submitted(string? location = \u0022Orchard Rd\u0022) =\u003E Claim.Submit(\n        ClaimNumber.Format(Market.SG, 2030, 1), Market.SG, LineOfBusiness.Motor, Claimant, \u0022Ada Claimant\u0022, \u0022POL-1\u0022, new DateOnly(2030, 1, 1),\n        \u0022Rear-ended.\u0022, location, T0);\n\n    private static Claim UnderReview()\n    {\n        Claim claim = Submitted();\n        Assert.True(claim.Pickup(Officer, \u0022Officer\u0022, T0).IsSuccess);\n        return claim;\n    }\n\n    private static string LastNote(Claim claim) =\u003E claim.Timeline.Last().Note;\n\n    private static FugueError Error(Result result) =\u003E Assert.IsType\u003CFugueError\u003E(Assert.Single(result.Errors));\n\n    [Fact]\n    public void Each_move_writes_the_note_the_claimant_reads()\n    {\n        Claim claim = Submitted();\n        Assert.Equal(\u0022Claim submitted.\u0022, LastNote(claim));\n\n        Assert.True(claim.Pickup(Officer, \u0022Officer\u0022, T0).IsSuccess);\n        Assert.Equal(\u0022A claims officer has started reviewing your claim.\u0022, LastNote(claim));\n\n        Assert.True(claim.RequestInfo(\u0022  Photos?  \u0022, Officer, \u0022Officer\u0022, T0).IsSuccess);\n        Assert.Equal(\u0022More information needed: Photos?\u0022, LastNote(claim));\n\n        Assert.True(claim.ProvideInfo(claim.OpenInfoRequest!.Id, \u0022  Attached.  \u0022, Claimant, \u0022Ada Claimant\u0022, T0).IsSuccess);\n        Assert.Equal(\u0022Information provided: Attached.\u0022, LastNote(claim));\n\n        Assert.True(claim.SetReserve(1000).IsSuccess);\n        Assert.True(claim.Approve(900, \u0022  Covered.  \u0022, Officer, \u0022Officer\u0022, T0).IsSuccess);\n        Assert.Equal(\u0022Your claim has been approved. Covered.\u0022, LastNote(claim));\n\n        Assert.True(claim.Settle(Officer, \u0022Officer\u0022, T0).IsSuccess);\n        Assert.Equal(\u0022Your claim has been settled.\u0022, LastNote(claim));\n    }\n\n    [Fact]\n    public void A_rejection_note_carries_the_reason()\n    {\n        Claim claim = UnderReview();\n\n        Assert.True(claim.Reject(\u0022  Not covered.  \u0022, Officer, \u0022Officer\u0022, T0).IsSuccess);\n\n        Assert.Equal(\u0022Your claim has been rejected. Not covered.\u0022, LastNote(claim));\n    }\n\n    [Theory]\n    [InlineData(null)]\n    [InlineData(\u0022\u0022)]\n    [InlineData(\u0022   \u0022)]\n    public void A_blank_location_is_stored_as_null(string? location) =\u003E Assert.Null(Submitted(location).IncidentLocation);\n\n    [Fact]\n    public void A_location_is_trimmed() =\u003E Assert.Equal(\u0022Orchard Rd\u0022, Submitted(\u0022  Orchard Rd  \u0022).IncidentLocation);\n\n    [Fact]\n    public void A_zero_reserve_is_refused_with_its_message_and_field()\n    {\n        FugueError error = Error(UnderReview().SetReserve(0));\n\n        Assert.Equal(\u0022claim.amount_invalid\u0022, error.Code);\n        Assert.Equal(\u0022The reserve must be greater than zero.\u0022, error.Message);\n        Assert.Equal([\u0022The reserve must be greater than zero.\u0022], error.Fields![\u0022amountMinor\u0022]);\n    }\n\n    [Fact]\n    public void Approving_without_a_reserve_says_a_reserve_must_be_set_first()\n    {\n        FugueError error = Error(UnderReview().Approve(100, \u0022Ok.\u0022, Officer, \u0022Officer\u0022, T0));\n\n        Assert.Equal(\u0022claim.reserve_required\u0022, error.Code);\n        Assert.Equal(\u0022A reserve must be set before a claim can be approved.\u0022, error.Message);\n    }\n\n    [Theory]\n    [InlineData(0)]\n    [InlineData(1001)]\n    public void An_approved_amount_outside_zero_to_reserve_is_refused_with_its_message(long amount)\n    {\n        Claim claim = UnderReview();\n        Assert.True(claim.SetReserve(1000).IsSuccess);\n\n        FugueError error = Error(claim.Approve(amount, \u0022Ok.\u0022, Officer, \u0022Officer\u0022, T0));\n\n        Assert.Equal(\u0022claim.amount_invalid\u0022, error.Code);\n        Assert.Equal(\u0022The approved amount must be greater than zero and not more than the reserve.\u0022, error.Message);\n        Assert.Equal([error.Message], error.Fields![\u0022amountMinor\u0022]);\n    }\n\n    [Fact]\n    public void Answering_with_a_wrong_request_id_is_a_404_that_says_so()\n    {\n        Claim claim = UnderReview();\n        Assert.True(claim.RequestInfo(\u0022Photos?\u0022, Officer, \u0022Officer\u0022, T0).IsSuccess);\n\n        FugueError error = Error(claim.ProvideInfo(ClaimInfoRequestId.New(), \u0022Here.\u0022, Claimant, \u0022Ada Claimant\u0022, T0));\n\n        Assert.Equal(\u0022claim.info_request_not_found\u0022, error.Code);\n        Assert.Equal(\u0022There is no open information request with that id on this claim.\u0022, error.Message);\n    }\n\n    [Fact]\n    public void Stamp_columns_start_empty_until_the_persistence_layer_fills_them()\n    {\n        Claim claim = Submitted();\n\n        Assert.Equal(string.Empty, claim.CreatedBy);\n        Assert.Equal(string.Empty, claim.UpdatedBy);\n    }\n}\n","tests":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/tests/Fugue.MutationTests/../Fugue.Tests/Audit/AuditRedactorTests.cs":{"language":"cs","source":"using System.Text.Json;\nusing Fugue.Application.Abstractions;\nusing Fugue.Domain.Audit;\nusing Fugue.Infrastructure.Audit;\nusing Microsoft.Extensions.Options;\n\nnamespace Fugue.Tests.Audit;\n\n/// \u003Csummary\u003EMasking, partial masking, attributes and the size bound of the stored \u003Cc\u003Echanges\u003C/c\u003E document (ADR-010).\u003C/summary\u003E\npublic sealed class AuditRedactorTests\n{\n    private sealed class Sample\n    {\n        public string Name { get; set; } = string.Empty;\n\n        public string? Email { get; set; }\n\n        public string? Phone { get; set; }\n\n        public string PasswordHash { get; set; } = string.Empty;\n\n        [AuditMask]\n        public string Nickname { get; set; } = string.Empty;\n\n        [NoAudit]\n        public string Scratch { get; set; } = string.Empty;\n\n        public string Custom { get; set; } = string.Empty;\n    }\n\n    private static AuditRedactor Redactor(AuditOptions? options = null) =\u003E new(Options.Create(options ?? new AuditOptions()));\n\n    private static JsonElement Build(AuditRedactor redactor, params (string Field, object? Old, object? New)[] fields) =\u003E\n        JsonDocument.Parse(redactor.Build(typeof(Sample), fields.ToDictionary(f =\u003E f.Field, f =\u003E AuditFieldChange.Changed(f.Old, f.New)))!).RootElement;\n\n    [Fact]\n    public void Built_in_secrets_are_masked_with_no_configuration_and_the_field_still_shows_as_changed()\n    {\n        JsonElement json = Build(Redactor(), (\u0022PasswordHash\u0022, \u0022AQAAAAEAACcQold\u0022, \u0022AQAAAAEAACcQnew\u0022));\n\n        Assert.Equal(\u0022***\u0022, json.GetProperty(\u0022passwordHash\u0022).GetProperty(\u0022old\u0022).GetString());\n        Assert.Equal(\u0022***\u0022, json.GetProperty(\u0022passwordHash\u0022).GetProperty(\u0022new\u0022).GetString());\n    }\n\n    [Fact]\n    public void Configured_names_the_mask_attribute_and_the_no_audit_attribute_are_honoured()\n    {\n        AuditRedactor redactor = Redactor(new AuditOptions { MaskedProperties = [\u0022custom\u0022] });\n\n        JsonElement json = Build(redactor, (\u0022Custom\u0022, \u0022a\u0022, \u0022b\u0022), (\u0022Nickname\u0022, \u0022n1\u0022, \u0022n2\u0022), (\u0022Scratch\u0022, \u0022s1\u0022, \u0022s2\u0022), (\u0022Name\u0022, \u0022x\u0022, \u0022y\u0022));\n\n        Assert.Equal(\u0022***\u0022, json.GetProperty(\u0022custom\u0022).GetProperty(\u0022new\u0022).GetString());\n        Assert.Equal(\u0022***\u0022, json.GetProperty(\u0022nickname\u0022).GetProperty(\u0022new\u0022).GetString());\n        Assert.False(json.TryGetProperty(\u0022scratch\u0022, out _));\n        Assert.Equal(\u0022y\u0022, json.GetProperty(\u0022name\u0022).GetProperty(\u0022new\u0022).GetString());\n    }\n\n    [Fact]\n    public void Email_and_phone_are_partially_masked_by_default_and_the_option_turns_it_off()\n    {\n        JsonElement masked = Build(Redactor(), (\u0022Email\u0022, \u0022john@example.test\u0022, \u0022jane@example.test\u0022), (\u0022Phone\u0022, \u0022\u002B14155550123\u0022, null));\n        JsonElement raw = Build(Redactor(new AuditOptions { PartialMaskPersonalData = false }), (\u0022Email\u0022, \u0022john@example.test\u0022, \u0022jane@example.test\u0022));\n\n        Assert.Equal(\u0022j***@example.test\u0022, masked.GetProperty(\u0022email\u0022).GetProperty(\u0022old\u0022).GetString());\n        Assert.Equal(\u0022***23\u0022, masked.GetProperty(\u0022phone\u0022).GetProperty(\u0022old\u0022).GetString());\n        Assert.Equal(JsonValueKind.Null, masked.GetProperty(\u0022phone\u0022).GetProperty(\u0022new\u0022).ValueKind);\n        Assert.Equal(\u0022john@example.test\u0022, raw.GetProperty(\u0022email\u0022).GetProperty(\u0022old\u0022).GetString());\n    }\n\n    [Fact]\n    public void A_document_over_the_byte_bound_is_truncated_with_a_marker_and_stays_valid_json()\n    {\n        AuditRedactor redactor = Redactor(new AuditOptions { MaxChangesBytes = 300 });\n        (string, object?, object?)[] fields = Enumerable.Range(0, 12).Select(i =\u003E ($\u0022Field{i}\u0022, (object?)new string(\u0027a\u0027, 30), (object?)new string(\u0027b\u0027, 30))).ToArray();\n\n        string stored = redactor.Build(typeof(Sample), fields.ToDictionary(f =\u003E f.Item1, f =\u003E AuditFieldChange.Changed(f.Item2, f.Item3)))!;\n\n        using JsonDocument json = JsonDocument.Parse(stored);\n        Assert.True(json.RootElement.GetProperty(\u0022_truncated\u0022).GetBoolean());\n        Assert.True(json.RootElement.GetProperty(\u0022_omittedFields\u0022).GetInt32() \u003E 0);\n        Assert.True(System.Text.Encoding.UTF8.GetByteCount(stored) \u003C= 300, stored.Length.ToString(System.Globalization.CultureInfo.InvariantCulture));\n        Assert.True(json.RootElement.TryGetProperty(\u0022field0\u0022, out _)); // the leading fields survive\n    }\n\n    [Fact]\n    public void A_document_within_the_bound_has_no_marker_and_a_huge_string_is_cut_and_flagged()\n    {\n        JsonElement small = Build(Redactor(), (\u0022Name\u0022, \u0022a\u0022, \u0022b\u0022));\n        JsonElement huge = Build(Redactor(), (\u0022Name\u0022, \u0022a\u0022, new string(\u0027z\u0027, 5000)));\n\n        Assert.False(small.TryGetProperty(\u0022_truncated\u0022, out _));\n        Assert.Equal(1024, huge.GetProperty(\u0022name\u0022).GetProperty(\u0022new\u0022).GetString()!.Length);\n        Assert.True(huge.GetProperty(\u0022_truncated\u0022).GetBoolean());\n    }\n\n    [Fact]\n    public void A_change_set_with_nothing_to_store_produces_no_document()\n    {\n        Assert.Null(Redactor().Build(typeof(Sample), new Dictionary\u003Cstring, AuditFieldChange\u003E { [\u0022Scratch\u0022] = AuditFieldChange.Added(\u0022x\u0022) }));\n    }\n}\n","tests":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/tests/Fugue.MutationTests/../Fugue.Tests/Audit/AuditRedactorBoundaryTests.cs":{"language":"cs","source":"using System.Text;\nusing System.Text.Json;\nusing Fugue.Application.Abstractions;\nusing Fugue.Domain.Audit;\nusing Fugue.Domain.Identity;\nusing Fugue.Infrastructure.Audit;\nusing Microsoft.Extensions.Options;\n\nnamespace Fugue.Tests.Audit;\n\n/// \u003Csummary\u003E\n/// The edges of \u003Csee cref=\u0022AuditRedactor\u0022/\u003E: exact byte budgets, the 1024-character cap, the partial-mask length rule, configured lists and the\n/// outbox-payload entry point. Found by mutation testing (docs/quality/mutation), where the happy paths in \u003Csee cref=\u0022AuditRedactorTests\u0022/\u003E left\n/// every boundary unpinned.\n/// \u003C/summary\u003E\npublic sealed class AuditRedactorBoundaryTests\n{\n    [NoAudit]\n    private sealed class Skipped;\n\n    private sealed class Plain\n    {\n        public string Name { get; set; } = string.Empty;\n\n        public string PasswordHash { get; set; } = string.Empty;\n\n        public string Custom { get; set; } = string.Empty;\n\n        [NoAudit]\n        public string Scratch { get; set; } = string.Empty;\n    }\n\n    private static AuditRedactor Redactor(AuditOptions? options = null) =\u003E new(Options.Create(options ?? new AuditOptions()));\n\n    private static string Build(AuditRedactor redactor, params (string Field, string Old, string New)[] fields) =\u003E\n        redactor.Build(typeof(Plain), fields.ToDictionary(f =\u003E f.Field, f =\u003E AuditFieldChange.Changed(f.Old, f.New)))!;\n\n    [Fact]\n    public void The_stamp_and_token_columns_are_noise_whatever_their_casing()\n    {\n        Assert.Equal(5, AuditRedactor.NoiseFields.Count);\n        foreach (string name in new[] { \u0022createdat\u0022, \u0022CREATEDBY\u0022, \u0022UpdatedAt\u0022, \u0022updatedby\u0022, \u0022rowversion\u0022 })\n        {\n            Assert.Contains(name, AuditRedactor.NoiseFields);\n        }\n    }\n\n    [Fact]\n    public void Entities_are_excluded_by_built_in_name_configured_name_or_attribute_and_not_otherwise()\n    {\n        AuditRedactor redactor = Redactor(new AuditOptions { ExcludedEntities = [\u0022Plain\u0022] });\n\n        Assert.True(redactor.IsExcluded(typeof(Plain))); // configured\n        Assert.True(redactor.IsExcluded(typeof(Skipped))); // [NoAudit] on the type\n        Assert.False(Redactor().IsExcluded(typeof(Plain)));\n        Assert.True(Redactor().IsExcluded(typeof(GrantAudit))); // built in, by CLR name\n    }\n\n    [Fact]\n    public void Configured_partial_mask_names_are_added_to_the_built_in_ones()\n    {\n        AuditRedactor redactor = Redactor(new AuditOptions { PartialMaskedProperties = [\u0022Custom\u0022] });\n\n        using JsonDocument json = JsonDocument.Parse(Build(redactor, (\u0022Custom\u0022, \u0022abcdefgh\u0022, \u0022ijklmnop\u0022)));\n\n        Assert.Equal(\u0022***gh\u0022, json.RootElement.GetProperty(\u0022custom\u0022).GetProperty(\u0022old\u0022).GetString());\n    }\n\n    [Theory]\n    [InlineData(\u0022abcde\u0022, \u0022***\u0022)] // five characters: too short to show the tail\n    [InlineData(\u0022abcdef\u0022, \u0022***ef\u0022)] // six: shows the last two\n    [InlineData(\u0022@x.test\u0022, \u0022***st\u0022)] // an @ in position 0 is not an email\n    [InlineData(\u0022a@x.test\u0022, \u0022a***@x.test\u0022)]\n    public void Partial_masking_follows_the_length_and_at_sign_rules(string input, string expected) =\u003E\n        Assert.Equal(expected, AuditRedactor.PartialMask(input));\n\n    [Fact]\n    public void A_masked_field_that_is_null_stays_null()\n    {\n        using JsonDocument json = JsonDocument.Parse(\n            Redactor().Build(typeof(Plain), new Dictionary\u003Cstring, AuditFieldChange\u003E { [\u0022PasswordHash\u0022] = AuditFieldChange.Changed(null, \u0022secret\u0022) })!);\n\n        Assert.Equal(JsonValueKind.Null, json.RootElement.GetProperty(\u0022passwordHash\u0022).GetProperty(\u0022old\u0022).ValueKind);\n        Assert.Equal(\u0022***\u0022, json.RootElement.GetProperty(\u0022passwordHash\u0022).GetProperty(\u0022new\u0022).GetString());\n    }\n\n    [Fact]\n    public void A_string_of_exactly_1024_characters_is_kept_whole_and_one_more_is_cut()\n    {\n        using JsonDocument exact = JsonDocument.Parse(Build(Redactor(), (\u0022Name\u0022, \u0022a\u0022, new string(\u0027z\u0027, 1024))));\n        using JsonDocument over = JsonDocument.Parse(Build(Redactor(), (\u0022Name\u0022, \u0022a\u0022, new string(\u0027z\u0027, 1025))));\n\n        Assert.Equal(1024, exact.RootElement.GetProperty(\u0022name\u0022).GetProperty(\u0022new\u0022).GetString()!.Length);\n        Assert.False(exact.RootElement.TryGetProperty(\u0022_truncated\u0022, out _));\n        Assert.Equal(1024, over.RootElement.GetProperty(\u0022name\u0022).GetProperty(\u0022new\u0022).GetString()!.Length);\n        Assert.True(over.RootElement.GetProperty(\u0022_truncated\u0022).GetBoolean());\n    }\n\n    [Fact]\n    public void A_document_exactly_at_the_budget_fits_without_a_marker()\n    {\n        // Budget is max(MaxChangesBytes, 96) = 96. Cost per field = key \u002B value json \u002B 5; value json = 19 \u002B len(old) \u002B len(new). Costs 31, 31, 32; with the 2\n        // braces the document needs exactly 96.\n        string stored = Build(Redactor(new AuditOptions { MaxChangesBytes = 96 }), (\u0022a\u0022, \u0022aaa\u0022, \u0022bbb\u0022), (\u0022b\u0022, \u0022aaa\u0022, \u0022bbb\u0022), (\u0022c\u0022, \u0022aaaa\u0022, \u0022bbb\u0022));\n\n        using JsonDocument json = JsonDocument.Parse(stored);\n        Assert.False(json.RootElement.TryGetProperty(\u0022_truncated\u0022, out _));\n        Assert.True(json.RootElement.TryGetProperty(\u0022c\u0022, out _));\n    }\n\n    [Fact]\n    public void A_field_that_leaves_exactly_the_marker_reserve_is_kept()\n    {\n        // First field: 2 \u002B cost 46 \u002B 48 reserve = 96 = the budget, so it stays; the large second field does not fit and is counted as omitted.\n        string stored = Build(\n            Redactor(new AuditOptions { MaxChangesBytes = 96 }),\n            (\u0022a\u0022, new string(\u0027x\u0027, 10), new string(\u0027y\u0027, 11)),\n            (\u0022b\u0022, new string(\u0027x\u0027, 20), new string(\u0027y\u0027, 20)));\n\n        using JsonDocument json = JsonDocument.Parse(stored);\n        Assert.True(json.RootElement.TryGetProperty(\u0022a\u0022, out _));\n        Assert.False(json.RootElement.TryGetProperty(\u0022b\u0022, out _));\n        Assert.Equal(1, json.RootElement.GetProperty(\u0022_omittedFields\u0022).GetInt32());\n        Assert.True(Encoding.UTF8.GetByteCount(stored) \u003C= 96);\n    }\n\n    [Fact]\n    public void A_tiny_configured_bound_is_raised_to_the_marker_floor_and_the_leading_field_survives()\n    {\n        string stored = Build(Redactor(new AuditOptions { MaxChangesBytes = 1 }), (\u0022a\u0022, \u0022x\u0022, \u0022y\u0022), (\u0022b\u0022, \u0022x\u0022, \u0022y\u0022), (\u0022c\u0022, \u0022x\u0022, \u0022y\u0022), (\u0022d\u0022, \u0022x\u0022, \u0022y\u0022));\n\n        using JsonDocument json = JsonDocument.Parse(stored);\n        Assert.True(json.RootElement.TryGetProperty(\u0022a\u0022, out _));\n        Assert.True(json.RootElement.GetProperty(\u0022_truncated\u0022).GetBoolean());\n        Assert.True(Encoding.UTF8.GetByteCount(stored) \u003C= 96);\n    }\n\n    [Fact]\n    public void When_not_even_one_field_fits_the_document_is_only_the_marker_and_still_valid_json()\n    {\n        string stored = Build(Redactor(new AuditOptions { MaxChangesBytes = 1 }), (\u0022a\u0022, new string(\u0027x\u0027, 60), new string(\u0027y\u0027, 60)));\n\n        using JsonDocument json = JsonDocument.Parse(stored);\n        Assert.Equal(\u0022{\\\u0022_truncated\\\u0022:true,\\\u0022_omittedFields\\\u0022:1}\u0022, stored);\n        Assert.True(json.RootElement.GetProperty(\u0022_truncated\u0022).GetBoolean());\n    }\n\n    [Fact]\n    public void An_empty_field_name_does_not_throw_and_is_written_as_an_empty_key()\n    {\n        string stored = Build(Redactor(), (\u0022\u0022, \u0022a\u0022, \u0022b\u0022));\n\n        Assert.StartsWith(\u0022{\\\u0022\\\u0022:\u0022, stored, StringComparison.Ordinal);\n    }\n\n    [Fact]\n    public void TryRedact_leaves_out_no_audit_properties_and_masks_the_rest_like_an_audit_value()\n    {\n        AuditRedactor redactor = Redactor();\n\n        Assert.False(redactor.TryRedact(typeof(Plain), \u0022Scratch\u0022, \u0022x\u0022, out object? scratch));\n        Assert.Null(scratch);\n\n        Assert.True(redactor.TryRedact(typeof(Plain), \u0022passwordhash\u0022, \u0022secret\u0022, out object? secret)); // name lookup ignores case\n        Assert.Equal(\u0022***\u0022, secret);\n\n        Assert.True(redactor.TryRedact(typeof(Plain), \u0022Name\u0022, \u0022Ada\u0022, out object? name));\n        Assert.Equal(\u0022Ada\u0022, name);\n\n        Assert.True(redactor.TryRedact(typeof(Plain), \u0022Unknown\u0022, 42, out object? number)); // a name the type does not have is kept as is\n        Assert.Equal(42, number);\n\n        Assert.True(redactor.TryRedact(typeof(Plain), \u0022Name\u0022, new string(\u0027q\u0027, 2000), out object? capped));\n        Assert.Equal(1024, ((string)capped!).Length);\n    }\n}\n","tests":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/tests/Fugue.MutationTests/../Fugue.Tests/Idempotency/IdempotencyKeyHeaderTests.cs":{"language":"cs","source":"using Fugue.Api.Idempotency;\nusing Microsoft.Extensions.Primitives;\n\nnamespace Fugue.Tests.Idempotency;\n\n/// \u003Csummary\u003EThe \u003Cc\u003EIdempotency-Key\u003C/c\u003E header grammar (ADR-013): one Structured Field String or a bare token, nothing else.\u003C/summary\u003E\npublic sealed class IdempotencyKeyHeaderTests\n{\n    [Theory]\n    [InlineData(\u0022\\\u0022abc\\\u0022\u0022, \u0022abc\u0022)]\n    [InlineData(\u0022  \\\u0022abc\\\u0022  \u0022, \u0022abc\u0022)]\n    [InlineData(\u0022\\\u0022with space and ,comma;semi\\\u0022\u0022, \u0022with space and ,comma;semi\u0022)]\n    [InlineData(\u0022\\\u0022quote\\\\\\\u0022inside\\\u0022\u0022, \u0022quote\\\u0022inside\u0022)]\n    [InlineData(\u0022\\\u0022back\\\\\\\\slash\\\u0022\u0022, \u0022back\\\\slash\u0022)]\n    [InlineData(\u0022abc-123_X.y:z\u0022, \u0022abc-123_X.y:z\u0022)]\n    public void A_single_string_or_a_bare_token_is_a_key(string header, string key)\n    {\n        HeaderParse parsed = IdempotencyKeyHeader.Parse(header);\n\n        Assert.True(parsed.IsPresent);\n        Assert.True(parsed.IsValid);\n        Assert.Equal(key, parsed.Key);\n    }\n\n    [Theory]\n    [InlineData(\u0022\u0022)]\n    [InlineData(\u0022   \u0022)]\n    public void A_present_but_blank_header_is_invalid_not_absent(string header)\n    {\n        HeaderParse parsed = IdempotencyKeyHeader.Parse(header);\n\n        Assert.True(parsed.IsPresent);\n        Assert.False(parsed.IsValid);\n    }\n\n    [Fact]\n    public void A_missing_header_is_no_key() =\u003E Assert.False(IdempotencyKeyHeader.Parse(StringValues.Empty).IsPresent);\n\n    [Theory]\n    [InlineData(\u0022\\\u0022\\\u0022\u0022)] // empty decoded value\n    [InlineData(\u0022\\\u0022abc\u0022)] // no closing quote\n    [InlineData(\u0022\\\u0022a\\\u0022 , \\\u0022b\\\u0022\u0022)] // a list\n    [InlineData(\u0022\\\u0022a\\\u0022,\\\u0022b\\\u0022\u0022)]\n    [InlineData(\u0022a,b\u0022)]\n    [InlineData(\u0022\\\u0022abc\\\u0022;x=1\u0022)] // a parameter\n    [InlineData(\u0022\\\u0022bad\\\\escape\\\u0022\u0022)] // only \\\u0022 and \\\\ are escapes\n    [InlineData(\u0022\\\u0022trailing\\\\\u0022)]\n    [InlineData(\u0022\\\u0022tab\\there\\\u0022\u0022)] // control character\n    [InlineData(\u0022\\\u0022del\\u007f\\\u0022\u0022)]\n    [InlineData(\u0022\\\u0022caf\u00E9\\\u0022\u0022)] // not ASCII\n    [InlineData(\u0022has space\u0022)] // a bare token has no spaces\n    [InlineData(\u0022a/b\u0022)]\n    public void Anything_else_is_invalid(string header)\n    {\n        HeaderParse parsed = IdempotencyKeyHeader.Parse(header);\n\n        Assert.True(parsed.IsPresent);\n        Assert.False(parsed.IsValid);\n    }\n\n    [Fact]\n    public void Two_header_lines_are_invalid() =\u003E\n        Assert.False(IdempotencyKeyHeader.Parse(new StringValues([\u0022\\\u0022a\\\u0022\u0022, \u0022\\\u0022b\\\u0022\u0022])).IsValid);\n\n    [Fact]\n    public void The_length_limit_is_255_decoded_characters()\n    {\n        Assert.True(IdempotencyKeyHeader.Parse($\u0022\\\u0022{new string(\u0027k\u0027, 255)}\\\u0022\u0022).IsValid);\n        Assert.False(IdempotencyKeyHeader.Parse($\u0022\\\u0022{new string(\u0027k\u0027, 256)}\\\u0022\u0022).IsValid);\n        Assert.True(IdempotencyKeyHeader.Parse(new string(\u0027k\u0027, 255)).IsValid);\n        Assert.False(IdempotencyKeyHeader.Parse(new string(\u0027k\u0027, 256)).IsValid);\n        Assert.Equal(255, IdempotencyKeyHeader.Parse($\u0022\\\u0022{string.Concat(Enumerable.Repeat(\u0022\\\\\\\u0022\u0022, 255))}\\\u0022\u0022).Key!.Length); // escapes count once\n    }\n}\n","tests":[]},"/Users/khumeren/Repos/personal-work/fugue/.worktrees/nth-quality/tests/Fugue.MutationTests/../Fugue.Tests/Idempotency/IdempotencyKeyHeaderBoundaryTests.cs":{"language":"cs","source":"using Fugue.Api.Idempotency;\nusing Microsoft.Extensions.Primitives;\n\nnamespace Fugue.Tests.Idempotency;\n\n/// \u003Csummary\u003EEdges of the header grammar that the grammar tests leave open (found by mutation testing, docs/quality/mutation).\u003C/summary\u003E\npublic sealed class IdempotencyKeyHeaderBoundaryTests\n{\n    [Theory]\n    [InlineData(\u0022\\\u0022a\\\u0022\u0022, \u0022a\u0022)] // one decoded character is the minimum\n    [InlineData(\u0022\\\u0022~\\\u0022\u0022, \u0022~\u0022)] // the last printable ASCII character\n    [InlineData(\u0022\\\u0022 \\\u0022\u0022, \u0022 \u0022)] // the first printable ASCII character\n    public void The_printable_ascii_range_and_the_one_character_minimum_are_inclusive(string header, string key)\n    {\n        HeaderParse parsed = IdempotencyKeyHeader.Parse(header);\n\n        Assert.True(parsed.IsValid);\n        Assert.Equal(key, parsed.Key);\n    }\n\n    [Fact]\n    public void An_absent_header_is_a_valid_no_key_result()\n    {\n        HeaderParse absent = IdempotencyKeyHeader.Parse(StringValues.Empty);\n\n        Assert.False(absent.IsPresent);\n        Assert.True(absent.IsValid);\n        Assert.Null(absent.Key);\n    }\n\n    [Fact]\n    public void A_null_header_line_counts_as_blank_and_is_invalid()\n    {\n        HeaderParse parsed = IdempotencyKeyHeader.Parse(new StringValues([null]));\n\n        Assert.True(parsed.IsPresent);\n        Assert.False(parsed.IsValid);\n    }\n}\n","tests":[]}},"thresholds":{"high":90,"low":70}};
