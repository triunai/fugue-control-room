<nav class="side" aria-label="Sections">
  <div class="side-head">
    <a routerLink="/" class="brand" aria-label="Fugue Console home">
      <fg-brand-mark />
      <span class="brand-name">Fugue <span class="brand-sub">Console</span></span>
    </a>
    <button
      type="button"
      class="rail-toggle"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-pressed]="collapsed()"
      title="Toggle with ["
      (click)="prefs.toggleSidebar()"
    >
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
        <path
          [attr.d]="collapsed() ? 'M6 3l5 5-5 5' : 'M10 3L5 8l5 5'"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>
  <div class="nav-scroll" data-tour="nav">
    @for (group of groups(); track group.label) {
      @let open = collapsed() || !folded().has(group.label);
      <button
        type="button"
        class="group"
        [class.holds-active]="active()?.group === group.label"
        [attr.aria-expanded]="open"
        [attr.aria-controls]="'grp-' + group.label"
        (click)="prefs.toggleGroup(group.label)"
      >
        <span>{{ group.label }}</span>
        @if (group.badge > 0) {
          <span class="badge">{{ group.badge }}</span>
        }
        <span class="fold" aria-hidden="true">{{ open ? '−' : '+' }}</span>
      </button>
      <div class="fold-body" [class.closed]="!open" [id]="'grp-' + group.label">
        <ul role="list">
          @for (item of group.items; track item.path) {
            <li>
              <a
                class="item"
                [routerLink]="item.path"
                [class.on]="active()?.path === item.path"
                [attr.aria-current]="active()?.path === item.path ? 'page' : null"
                [attr.data-tip]="item.label"
                [attr.aria-label]="collapsed() ? item.label : null"
              >
                <svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true">
                  <path
                    [attr.d]="item.icon"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <span class="label">{{ item.label }}</span>
                @if (badges()[item.path]; as n) {
                  <span class="badge">{{ n }}</span>
                }
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </div>
  <div class="side-foot">
    <fg-account-menu [rail]="collapsed()" />
    <p class="status" [attr.data-tip]="healthLabel()">
      <span
        class="dot"
        [class.up]="health() === 'up'"
        [class.down]="health() === 'down'"
        role="img"
        [attr.aria-label]="healthLabel()"
      ></span>
      <span class="label">Single-tenant &middot; API v1</span>
    </p>
  </div>
</nav>
