# ledger-check ratchet. Leave every value empty to enforce the whole spine (right for a new repo).
# Adopting on a repo with old docs? Entries >= a cutoff are enforced; entries before it are counted, not enforced.
# Set numbered cutoffs to (highest existing number + 1) and LOG_CUTOFF to tomorrow's date. Lower a value later to cover more history.
# One KEY=value per line. No spaces, no quotes. See .githooks/README.md, "Set ratchet cutoffs".

# First log date to enforce, YYYY-MM-DD (example: 2026-10-02)
LOG_CUTOFF=
# First decision number to enforce (example: 12 means D-012 and up)
DECISION_CUTOFF=
# First backlog number to enforce (example: 40 means #040 and up)
BACKLOG_CUTOFF=
# First workstream number to enforce (example: 5 means WS-05 and up)
WS_CUTOFF=
