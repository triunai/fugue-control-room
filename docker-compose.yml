# Fugue stack for development. Credentials come from the untracked .env (copy .env.example). Runbook 10.
#   docker compose up -d postgres   DB only (the dotnet run / ng serve flow, runbooks 03 and 09)
#   docker compose up -d --build    postgres + migrate + api (Development, seeded) + web console
services:
  postgres:
    image: postgres:17-alpine
    container_name: fugue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fugue
      POSTGRES_USER: fugue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env} # secrets-scan:ignore (reference, not a value)
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # set POSTGRES_PORT in .env if 5432 is taken by a host Postgres
    volumes:
      - fugue-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fugue -d fugue"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the EF migrations bundle, then exits 0. The API does not migrate on startup.
  migrate:
    build:
      context: .
      target: migrate
    command:
      - --connection
      - "Host=postgres;Port=5432;Database=fugue;Username=fugue;Password=${POSTGRES_PASSWORD:?set it in .env}" # secrets-scan:ignore (reference, not a value)
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development # the seeder and the webhook dev sink are Development-only
      Seed__Enabled: "true"
      Webhooks__AllowInsecureLocal: "true"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=fugue;Username=fugue;Password=${POSTGRES_PASSWORD:?set it in .env}" # secrets-scan:ignore (reference, not a value)
      # Empty when unset: compose interpolates the whole file, so a hard requirement here would also break `up -d postgres`.
      # The API itself refuses to start with a missing, short or placeholder key (runbook 10, troubleshooting).
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-} # secrets-scan:ignore (reference, not a value)
    ports:
      - "${API_PORT:-5081}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The runtime image has no curl; speak HTTP to the anonymous ping over bash's /dev/tcp (sh has no /dev/tcp).
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/v1/diagnostics/ping HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fugue-pgdata:
