# Fugue stack for development. Credentials come from the untracked .env (copy .env.example). Runbook 10.
#   docker compose up -d postgres   DB only (the dotnet run / ng serve flow, runbooks 03 and 09)
#   docker compose up -d --build    postgres + migrate + api (Development, seeded) + web console
#   EVENTS_PUBLISHER=Both docker compose --profile kafka up -d --build   adds a Redpanda broker and publishes claim events to it too (runbook 12)
services:
  postgres:
    image: postgres:17-alpine
    container_name: fugue-postgres
    # File logging so pgAdmin's Logs tab works (stderr + csvlog under $PGDATA/log); slow statements over 200 ms are logged.
    # Watch every statement while demoing: ALTER SYSTEM SET log_statement = 'all'; SELECT pg_reload_conf();
    command: ["postgres", "-c", "logging_collector=on", "-c", "log_destination=stderr,csvlog", "-c", "log_min_duration_statement=200"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: fugue
      POSTGRES_USER: fugue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env} # secrets-scan:ignore (reference, not a value)
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # set POSTGRES_PORT in .env if 5432 is taken by a host Postgres
    volumes:
      - fugue-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fugue -d fugue"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Audit search (D-058, runbook 06): a rebuildable index of audit_log, fed by the API's indexer. The API runs without it when its URL is unset.
  # Keep the image tag in step with the Testcontainers image in tests/Fugue.Tests/Audit/AuditSearchTests.cs.
  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    container_name: fugue-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set it in .env (16+ bytes)} # secrets-scan:ignore (reference, not a value)
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - fugue-meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional Kafka-compatible broker (profile `kafka`, runbook 12): single node, dev mode. Inside the stack use redpanda:9092; from the host localhost:${KAFKA_PORT}.
  # Keep the image tag in step with the Testcontainers image in tests/Fugue.Tests/Messaging/KafkaPublisherTests.cs.
  redpanda:
    profiles: ["kafka"]
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.18
    container_name: fugue-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_PORT:-19092}
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies the EF migrations bundle, then exits 0. The API does not migrate on startup.
  migrate:
    build:
      context: .
      target: migrate
    command:
      - --connection
      - "Host=postgres;Port=5432;Database=fugue;Username=fugue;Password=${POSTGRES_PASSWORD:?set it in .env}" # secrets-scan:ignore (reference, not a value)
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development # the seeder and the webhook dev sink are Development-only
      # The container listens on 8080 (ASPNETCORE_HTTP_PORTS), not the host-run default 5080, so the seeded claim.* subscription must say so.
      Seed__DevSinkUrl: http://localhost:8080/api/v1/dev/webhook-sink
      Seed__Enabled: "true"
      Webhooks__AllowInsecureLocal: "true"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=fugue;Username=fugue;Password=${POSTGRES_PASSWORD:?set it in .env}" # secrets-scan:ignore (reference, not a value)
      # Empty when unset: compose interpolates the whole file, so a hard requirement here would also break `up -d postgres`.
      # The API itself refuses to start with a missing, short or placeholder key (runbook 10, troubleshooting).
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-} # secrets-scan:ignore (reference, not a value)
      # Webhooks (default) leaves the relay as it was; Both also produces to Kafka and needs the `kafka` profile (the broker). Runbook 12.
      Events__Publisher: ${EVENTS_PUBLISHER:-Webhooks}
      Events__Kafka__BootstrapServers: redpanda:9092
      Search__Meilisearch__Url: http://meilisearch:7700
      Search__Meilisearch__ApiKey: ${MEILI_MASTER_KEY:?set it in .env (16+ bytes)} # secrets-scan:ignore (reference, not a value)
    ports:
      - "${API_PORT:-5081}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      meilisearch:
        condition: service_healthy
    healthcheck:
      # The runtime image has no curl; speak HTTP to the anonymous ping over bash's /dev/tcp (sh has no /dev/tcp).
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/v1/diagnostics/ping HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fugue-pgdata:
  fugue-meili:
