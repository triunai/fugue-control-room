# lefthook.yml - the SINGLE git hook orchestrator for Fugue.
# Decision: the kit's hook logic lives in scripts (scripts/spine/*.sh, .githooks/commit-msg) and
# lefthook calls them. core.hooksPath is deliberately NOT set; lefthook installs into .git/hooks.
# Setting both would run two orchestrators. See hygiene.md "Hook wiring".
#
# TWO CLASSES: tag `baseline` (always-on, blocking) and tag `guardrail` (advisory, never fails).
# Pause the advisory layer for one command:  LEFTHOOK_EXCLUDE=guardrail git push
# Install: `npm install` (prepare script runs `lefthook install`).

pre-commit:
  commands:
    secrets-scan:
      tags: baseline
      run: bash scripts/spine/secrets-scan.sh
    dotnet-format:
      tags: baseline
      # Only when *.cs is staged AND a solution exists. Skips cleanly before Phase 1.
      glob: "*.cs"
      run: |
        SLN=$(git ls-files '*.sln' '*.slnx' | head -n1)
        if [ -z "$SLN" ]; then echo "dotnet-format: no solution yet - skipped"; exit 0; fi
        dotnet format "$SLN" --verify-no-changes --no-restore
    test-integrity:
      tags: guardrail
      # ADVISORY (always exits 0): new Skip =, dropped Assert.*/Should(), deleted test files.
      run: node scripts/check-test-integrity.mjs
    prune-check:
      tags: guardrail
      # ADVISORY (exit 0): done thread still on the board, dropped W without a journal entry, stale hot-state.
      run: node scripts/spine/prune-check.mjs

commit-msg:
  commands:
    kit-commit-msg:
      tags: baseline
      # The kit's rule: <type>(<scope>)?: <summary>, 10..150 chars, no pasted file lists.
      run: bash .githooks/commit-msg {1}
    commitlint:
      tags: baseline
      run: npx --no -- commitlint --edit {1}
    refs-trailer:
      tags: baseline
      # Agent commits (Co-Authored-By: Claude) need a `Refs:` trailer; several ids allowed (`Refs: W-012, ADR-010`), each must resolve. Humans exempt.
      run: node scripts/check-refs-trailer.mjs {1}
    fix-has-test:
      tags: baseline
      # A fix(...) commit touching src/ must touch tests/ or carry `Tests: none (<reason>)`.
      run: node scripts/check-fix-has-test.mjs {1}

pre-push:
  commands:
    stack-check:
      tags: baseline
      # dotnet restore, build --no-restore, test --no-build. Skips with exit 0 when no solution exists.
      run: bash scripts/spine/stack-check.sh --test
    ledger-check:
      tags: baseline
      run: bash scripts/spine/ledger-check.sh
    adr-check:
      tags: baseline
      # Every ADR linked from a D entry; every `Promote: yes` has its ADR.
      run: node scripts/spine/adr-check.mjs
    commit-link-check:
      tags: guardrail
      # WARN-only: commits not linked to a ledger entry or an open W; ADRs and closed-W parity.
      run: node scripts/spine/commit-link-check.mjs
    trace-stale:
      tags: guardrail
      # ADVISORY (exit 0): regenerates docs/traceability.md in memory and warns if the committed file differs. Never writes.
      run: node scripts/spine/trace-index.mjs --check
    codex-gate:
      tags: guardrail
      # ADVISORY (D-014): seam-triggered cross-model review, detached, capped at 8/day, never blocks or delays the push.
      use_stdin: true
      run: node scripts/codex-gate.mjs
    spine-nudge:
      tags: guardrail
      # WARN-only. Needs git's pre-push refs on stdin.
      use_stdin: true
      run: bash scripts/spine/spine-nudge.sh
